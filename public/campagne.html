<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lancer ma campagne — Skyeco Pro</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f5f8f6; color:#14312a; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border-radius:16px; padding:36px; max-width:460px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
  h1 { font-size:1.4rem; margin-bottom:8px; }
  .sub { color:#5b6b64; font-size:0.92rem; margin-bottom:28px; }
  label { display:block; font-size:0.85rem; font-weight:700; margin-bottom:8px; color:#14312a; }
  .budget-input-row { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .budget-input-row input {
    flex:1; font-size:1.6rem; font-weight:800; padding:14px 16px; border:2px solid #d7dedb;
    border-radius:12px; color:#14312a; text-align:right;
  }
  .budget-input-row input:focus { outline:none; border-color:#1e6f4c; }
  .budget-input-row .unit { font-size:1.4rem; font-weight:800; color:#5b6b64; }

  .estimation-box { background:#eef1f0; border-radius:12px; padding:18px 20px; margin-bottom:12px; }
  .estimation-box .clics { font-size:1.8rem; font-weight:800; color:#1e6f4c; }
  .estimation-box .clics-label { font-size:0.85rem; color:#5b6b64; }
  .estimation-box .detail { font-size:0.8rem; color:#5b6b64; margin-top:8px; }

  .breakdown { font-size:0.8rem; color:#5b6b64; margin-bottom:24px; line-height:1.7; }
  .breakdown strong { color:#14312a; }

  .consommation-box { background:#fff; border:1.5px solid #d7dedb; border-radius:12px; padding:20px; margin-bottom:24px; }
  .consommation-box h3 { font-size:0.95rem; margin-bottom:14px; }
  .conso-bar-track { background:#eef1f0; border-radius:8px; height:10px; overflow:hidden; margin-bottom:10px; }
  .conso-bar-fill { background:#e8622c; height:100%; transition:width 0.4s ease; }
  .conso-bar-fill.alerte { background:#c0392b; }
  .conso-stats { display:flex; justify-content:space-between; font-size:0.82rem; color:#5b6b64; }
  .conso-stats strong { color:#14312a; }
  .conso-detail { font-size:0.76rem; color:#8a9891; margin-top:10px; line-height:1.6; }

  .btn-payer {
    width:100%; background:#e8622c; color:#fff; border:none; border-radius:12px;
    padding:16px; font-size:1.02rem; font-weight:700; cursor:pointer;
  }
  .btn-payer:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-payer:hover:not(:disabled) { filter:brightness(1.05); }

  .resilier-link { display:block; text-align:center; margin-top:18px; font-size:0.82rem; color:#8a9891; text-decoration:underline; cursor:pointer; background:none; border:none; }
  .resilier-link:hover { color:#c0392b; }

  .loading, .error-msg { text-align:center; padding:40px 0; color:#5b6b64; }
  .error-msg { color:#c0392b; }

  .motscles-section { background:#f6faf7; border:1.5px solid #d7e8dd; border-radius:12px; padding:18px 20px; margin-bottom:24px; }
  .motscles-section h3 { font-size:0.95rem; margin-bottom:6px; }
  .motscles-hint { font-size:0.8rem; color:#5b6b64; margin-bottom:12px; line-height:1.5; }
  .motscles-textarea {
    width:100%; min-height:70px; padding:11px 12px; border:1.5px solid #d7dedb; border-radius:9px;
    font-size:0.88rem; font-family:inherit; resize:vertical; color:#14312a;
  }
  .motscles-textarea:focus { outline:none; border-color:#1e6f4c; }
  .btn-suggerer {
    margin-top:10px; background:#1e6f4c; color:#fff; border:none; border-radius:9px;
    padding:10px 16px; font-size:0.85rem; font-weight:700; cursor:pointer;
  }
  .btn-suggerer:hover:not(:disabled) { filter:brightness(1.08); }
  .btn-suggerer:disabled { opacity:0.6; cursor:wait; }
  .motscles-liste { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .motscle-item { display:flex; align-items:center; gap:8px; font-size:0.86rem; }
  .motscle-item input[type="checkbox"] { width:16px; height:16px; accent-color:#1e6f4c; flex-shrink:0; }
  .motscles-ajout { display:flex; gap:8px; margin-top:12px; }
  .motscles-ajout input {
    flex:1; padding:9px 11px; border:1.5px solid #d7dedb; border-radius:8px; font-size:0.85rem; font-family:inherit;
  }
  .motscles-ajout button {
    background:#f2f4f1; color:#14312a; border:none; border-radius:8px; padding:9px 14px;
    font-size:0.82rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .motscles-note { font-size:0.76rem; color:#8a9891; margin-top:10px; }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="loading">Chargement…</div>
</div>

<script>
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrbGRkd3VtaXJrZGprYnh2enlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMTMzNDksImV4cCI6MjA5ODc4OTM0OX0._2cVv3rmhHb-7VLTCqiMRq0F2S30NMnD8qRhTiBM7nc';
  const params = new URLSearchParams(window.location.search);
  const draftId = params.get('id');
  const app = document.getElementById('app');

  if (!draftId) {
    app.innerHTML = '<div class="error-msg">Lien invalide — identifiant du site manquant.</div>';
  } else if (params.get('lance') === '1' && params.get('session_id')) {
    confirmerEtLancer(params.get('session_id'));
  } else {
    render();
  }

  async function confirmerEtLancer(sessionId) {
    app.innerHTML = '<div class="loading">Confirmation du paiement et lancement de la campagne…</div>';
    try {
      const res = await fetch('/api/confirm-ad-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, draftId })
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        app.innerHTML = `<div class="error-msg">${data.error || 'Une erreur est survenue lors de la confirmation.'}</div>`;
        return;
      }
      app.innerHTML = `
        <h1>✅ Campagne lancée</h1>
        <p class="sub">Votre budget de ${data.budgetActif} € est actif.</p>
        <div class="estimation-box">
          <div class="detail" style="font-size:0.92rem; color:#14312a;">${data.campagneMessage}</div>
        </div>
      `;
    } catch (e) {
      app.innerHTML = '<div class="error-msg">Impossible de confirmer le paiement pour le moment.</div>';
    }
  }

  function render() {
    app.innerHTML = `
      <h1>Lancer votre campagne</h1>
      <p class="sub">Choisissez le montant que vous souhaitez investir ce mois-ci. Le calcul se met à jour automatiquement.</p>

      <div id="consommationSection"></div>

      <div class="motscles-section">
        <h3>✨ Quels mots-clés pour votre annonce ?</h3>
        <div class="motscles-hint">Décrivez votre métier et ce que vous voulez mettre en avant (prestations, produits, ce qui attire vos clients) — l'IA vous propose des mots-clés à cocher.</div>
        <textarea class="motscles-textarea" id="motsClesDescription" placeholder="Ex : je pose des terrasses en bois et composite, je fais aussi des clôtures. Je veux surtout attirer des clients pour la pose de terrasse."></textarea>
        <button type="button" class="btn-suggerer" id="btnSuggererMotsCles">✨ Suggérer des mots-clés</button>
        <div class="motscles-liste" id="motsClesListe"></div>
        <div class="motscles-ajout" id="motsClesAjout" style="display:none;">
          <input type="text" id="motCleManuel" placeholder="Ajouter un mot-clé de votre choix">
          <button type="button" id="btnAjouterMotCleManuel">+ Ajouter</button>
        </div>
        <div class="motscles-note" id="motsClesNote"></div>
      </div>

      <label for="budgetInput">Montant à investir</label>
      <div class="budget-input-row">
        <input type="number" id="budgetInput" min="100" step="10" value="${Math.max(100, parseInt(params.get('budget'), 10) || 300)}" inputmode="numeric">
        <span class="unit">€</span>
      </div>

      <div class="estimation-box" id="estimationBox">
        <div class="clics" id="clicsValue">—</div>
        <div class="clics-label">clics estimés</div>
        <div class="detail" id="estimationDetail"></div>
      </div>
      <p style="font-size:0.76rem; color:#8a9891; margin-top:2px;">
        Ce budget n'est pas garanti sur un mois fixe — il est consommé au rythme réel des clics, plus ou moins vite selon la période.
      </p>

      <div class="breakdown" id="breakdown"></div>

      <button class="btn-payer" id="btnPayer" disabled>Payer et lancer ma campagne</button>
      <button class="resilier-link" id="btnPause" type="button">Mettre en pause 1 mois (sans prélèvement)</button>
      <button class="resilier-link" id="btnResilier" type="button">Résilier mon abonnement</button>
    `;

    const budgetInput = document.getElementById('budgetInput');
    const btnPayer = document.getElementById('btnPayer');
    let debounceTimer = null;

    // Métier/zone/mots-clés du brouillon, récupérés une seule fois (voir
    // chargerDraftPuisInitialiser ci-dessous) puis partagés entre l'estimation
    // de clics et le panneau de mots-clés IA, plutôt que deux requêtes
    // Supabase séparées comme avant (l'une d'elles envoyait en plus un champ
    // "departement" inexistant à l'API, qui attend "zone" — l'estimation ne
    // recevait donc jamais la vraie zone géographique).
    let draftMetier = null;
    let draftZone = null;
    let motsClesActuels = [];

    function mettreAJourEstimation() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(chargerEstimation, 400);
    }

    async function chargerEstimation() {
      const budget = parseFloat(budgetInput.value);
      if (!budget || budget < 100) {
        document.getElementById('clicsValue').textContent = '—';
        document.getElementById('estimationDetail').textContent = 'Montant minimum : 100 €';
        document.getElementById('breakdown').innerHTML = '';
        btnPayer.disabled = true;
        return;
      }

      document.getElementById('clicsValue').textContent = '…';

      try {
        const res = await fetch('/api/estimate-reach', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ metier: draftMetier, zone: draftZone, motsCles: motsClesActuels, budget })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('clicsValue').textContent = data.estimatedClicks !== null ? '≈ ' + data.estimatedClicks : '—';
          const potentiel = data.totalMonthlyVolume ? ` · Potentiel estimé sur ce mois : ${data.totalMonthlyVolume} clics possibles avec ces mots-clés et cette zone` : '';
          document.getElementById('estimationDetail').textContent =
            (data.avgCpcEur ? `CPC moyen estimé : ${data.avgCpcEur} €` : '') + potentiel;
          document.getElementById('breakdown').innerHTML =
            `Sur vos <strong>${budget} €</strong> : <strong>${data.commissionPub ?? '—'} €</strong> de frais de service (${Math.round((data.tauxCommission||0)*100)}%), <strong>${data.budgetNetPub ?? '—'} €</strong> réellement investis en publicité.`;
          btnPayer.disabled = false;
          btnPayer.textContent = `Payer ${budget} € et lancer ma campagne`;
        } else {
          document.getElementById('clicsValue').textContent = '—';
          document.getElementById('estimationDetail').textContent = "Estimation indisponible pour le moment.";
          btnPayer.disabled = true;
        }
      } catch (e) {
        document.getElementById('clicsValue').textContent = '—';
        document.getElementById('estimationDetail').textContent = "Erreur de connexion.";
        btnPayer.disabled = true;
      }
    }

    budgetInput.addEventListener('input', mettreAJourEstimation);
    chargerConsommation();
    chargerDraftPuisInitialiser();

    async function chargerDraftPuisInitialiser() {
      try {
        const resp = await fetch(`https://wklddwumirkdjkbxvzyj.supabase.co/rest/v1/skyeco_pro_vitrine_drafts?id=eq.${draftId}&select=metier,zone,mots_cles_choisis`, {
          headers: { apikey: SUPABASE_ANON_KEY }
        });
        const rows = await resp.json();
        const draft = rows[0] || {};
        draftMetier = draft.metier;
        draftZone = draft.zone;
        if (Array.isArray(draft.mots_cles_choisis)) motsClesActuels = draft.mots_cles_choisis;
      } catch (e) { /* on continue avec metier/zone/mots-clés vides — repli générique côté API */ }
      initMotsCles();
      chargerEstimation();
    }

    document.getElementById('btnPause').addEventListener('click', async () => {
      if (!confirm("Demander la mise en pause de votre abonnement ?\n\n• Rien ne s'arrête tout de suite.\n• 2 jours avant la fin de votre période déjà payée, vous recevrez un SMS avec un lien à cliquer pour confirmer.\n• C'est seulement à ce moment-là, si vous confirmez, que la pause prend effet.")) {
        return;
      }
      const btn = document.getElementById('btnPause');
      btn.disabled = true;
      btn.textContent = 'Enregistrement…';
      try {
        const res = await fetch('/api/demander-pause', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ draftId })
        });
        const data = await res.json();
        if (res.ok) {
          alert(data.message);
          btn.textContent = 'Pause demandée — SMS à venir';
        } else {
          alert(data.error || 'Une erreur est survenue.');
          btn.disabled = false;
          btn.textContent = 'Mettre en pause 1 mois (sans prélèvement)';
        }
      } catch (e) {
        alert('Impossible de contacter le serveur.');
        btn.disabled = false;
        btn.textContent = 'Mettre en pause 1 mois (sans prélèvement)';
      }
    });

    document.getElementById('btnResilier').addEventListener('click', async () => {
      if (!confirm("Confirmer la résiliation ? Votre vitrine restera active jusqu'à la fin de la période déjà payée, puis se désactivera automatiquement.")) {
        return;
      }
      const btn = document.getElementById('btnResilier');
      btn.disabled = true;
      btn.textContent = 'Résiliation en cours…';
      try {
        const res = await fetch('/api/cancel-subscription', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ draftId })
        });
        const data = await res.json();
        if (res.ok) {
          alert(data.message);
          btn.textContent = 'Abonnement annulé';
        } else {
          alert(data.error || 'Une erreur est survenue.');
          btn.disabled = false;
          btn.textContent = 'Résilier mon abonnement';
        }
      } catch (e) {
        alert('Impossible de contacter le serveur.');
        btn.disabled = false;
        btn.textContent = 'Résilier mon abonnement';
      }
    });

    async function chargerConsommation() {
      const section = document.getElementById('consommationSection');
      try {
        const res = await fetch('/api/get-campaign-spend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ draft_id: draftId })
        });
        const data = await res.json();

        if (!data.success || !data.campagneExiste) {
          section.innerHTML = ''; // pas encore de campagne, rien à afficher
          return;
        }

        const alerte = data.pourcentageConsomme >= 90 ? 'alerte' : '';
        section.innerHTML = `
          <div class="consommation-box">
            <h3>Consommation de votre budget</h3>
            <div class="conso-bar-track">
              <div class="conso-bar-fill ${alerte}" style="width:${data.pourcentageConsomme}%"></div>
            </div>
            <div class="conso-stats">
              <span><strong>${data.consommationAjustee} €</strong> consommés</span>
              <span><strong>${data.budgetRestant} €</strong> restants sur ${data.budgetPaye} €</span>
            </div>
            <div class="conso-detail">
              ${data.clics} clics · ${data.impressions} impressions ce mois-ci<br>
              Dépense réelle Google Ads : ${data.coutReelGoogleEuros} € (comptée double dans votre suivi, commission de service incluse)
            </div>
          </div>
        `;
      } catch (e) {
        section.innerHTML = '';
      }
    }

    btnPayer.addEventListener('click', async () => {
      const budget = parseFloat(budgetInput.value);
      btnPayer.disabled = true;
      btnPayer.textContent = 'Redirection vers le paiement…';
      try {
        const res = await fetch('/api/create-ad-budget-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ draftId, budget })
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || 'Erreur inconnue');
        }
      } catch (e) {
        alert("Impossible de démarrer le paiement : " + e.message);
        btnPayer.disabled = false;
        btnPayer.textContent = `Payer ${budget} € et lancer ma campagne`;
      }
    });

    function initMotsCles() {
      // Utilise draftMetier / draftZone / motsClesActuels déjà récupérés par
      // chargerDraftPuisInitialiser() — plus de requête Supabase séparée ici.
      const zoneEl = document.getElementById('motsClesDescription');
      const btnSuggerer = document.getElementById('btnSuggererMotsCles');
      const listeEl = document.getElementById('motsClesListe');
      const ajoutEl = document.getElementById('motsClesAjout');
      const noteEl = document.getElementById('motsClesNote');
      let selection = new Map(); // texte -> true/false (coché ou non)

      if (motsClesActuels.length) {
        motsClesActuels.forEach(m => selection.set(m, true));
        ajoutEl.style.display = 'flex';
        noteEl.textContent = 'Sélection déjà enregistrée — décochez ou ajoutez-en avant de lancer votre campagne.';
        rendreListe();
      }

      function rendreListe() {
        listeEl.innerHTML = [...selection.entries()].map(([texte, coche], i) => `
          <label class="motscle-item">
            <input type="checkbox" data-texte="${texte.replace(/"/g, '&quot;')}" ${coche ? 'checked' : ''}>
            ${texte}
          </label>
        `).join('');
        listeEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', () => {
            selection.set(cb.dataset.texte, cb.checked);
            sauvegarderSelection();
          });
        });
      }

      async function sauvegarderSelection() {
        motsClesActuels = [...selection.entries()].filter(([, coche]) => coche).map(([texte]) => texte);
        try {
          await fetch(`https://wklddwumirkdjkbxvzyj.supabase.co/rest/v1/skyeco_pro_vitrine_drafts?id=eq.${draftId}`, {
            method: 'PATCH',
            headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
            body: JSON.stringify({ mots_cles_choisis: motsClesActuels }),
          });
        } catch (e) { /* silencieux — la sélection reste visible côté artisan même si l'enregistrement échoue */ }
        // Dès que les mots-clés changent, on recalcule le nombre de clics
        // possible avec le budget actuel (mots-clés + zone → volume réel).
        chargerEstimation();
      }

      btnSuggerer.addEventListener('click', async () => {
        const description = zoneEl.value.trim();
        if (!description) {
          noteEl.textContent = 'Décrivez brièvement votre activité pour obtenir des suggestions.';
          return;
        }
        btnSuggerer.disabled = true;
        btnSuggerer.textContent = 'Génération en cours…';
        noteEl.textContent = '';
        try {
          const res = await fetch('/api/suggerer-mots-cles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ description, metier: draftMetier, zone: draftZone })
          });
          const data = await res.json();
          if (data.success) {
            data.motsCles.forEach(m => { if (!selection.has(m)) selection.set(m, true); });
            rendreListe();
            ajoutEl.style.display = 'flex';
            noteEl.textContent = 'Décochez ceux que vous ne voulez pas utiliser, ou ajoutez les vôtres.';
            sauvegarderSelection();
          } else {
            noteEl.textContent = data.error || 'Impossible de générer des suggestions pour le moment.';
          }
        } catch (e) {
          noteEl.textContent = 'Impossible de contacter le serveur.';
        } finally {
          btnSuggerer.disabled = false;
          btnSuggerer.textContent = '✨ Suggérer des mots-clés';
        }
      });

      document.getElementById('btnAjouterMotCleManuel').addEventListener('click', () => {
        const input = document.getElementById('motCleManuel');
        const texte = input.value.trim();
        if (!texte || selection.has(texte)) return;
        selection.set(texte, true);
        rendreListe();
        sauvegarderSelection();
        input.value = '';
      });
    }
  }
</script>

</body>
