<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact Chantier — le suivi de chantier entre artisans</title>
<meta name="description" content="Photos, problèmes, vidéos, plans et discussions de tous les corps de métier d'un chantier, visibles par l'architecte ou le maître d'œuvre.">
<meta name="theme-color" content="#1E2328">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contact Chantier">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --ink:#1E2328; --mute:#6B7178; --line:#E3DED6;
  --acc:#E8590C; --acc-soft:#FDEBDD; --ok:#2F8F5B; --ok-soft:#E1F2E8;
  --warn:#C98A00; --warn-soft:#FBF0D3; --bad:#C8372D; --bad-soft:#F9E0DE;
  --blue:#2C5D8F; --blue-soft:#E1EAF4; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:110px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px;text-decoration:none;color:#fff}
.logo-mark{width:32px;height:32px;border-radius:8px;background:#163A63;box-shadow:0 0 0 1.5px rgba(255,255,255,.6);display:grid;place-items:center;flex:none}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.hbtn{color:#fff;background:#2E353C;border:1px solid #3B444C;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600}
.back{color:#fff;text-decoration:none;font-size:26px;padding:0 6px 0 0;line-height:1}
main{padding:16px}
h1{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
h2{font-size:16px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--mute);font-size:13.5px;margin-top:4px;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tap{transition:transform .08s;cursor:pointer}.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:#8A5E00}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-mute{background:#EEEAE4;color:var(--mute)}.p-acc{background:var(--acc-soft);color:#A6430A}
.bar{height:7px;background:#EEEAE4;border-radius:9px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#F8F6F2;border-radius:10px;padding:9px 10px}
.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(54px + env(safe-area-inset-top));background:var(--bg);z-index:10;margin:0 -16px;padding:4px 16px 12px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;white-space:nowrap;position:relative}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.prob{display:flex;gap:12px}
.thumb{width:62px;height:62px;border-radius:10px;flex:none;overflow:hidden;background:#E9E4DC;display:grid;place-items:center;position:relative;color:var(--mute)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center}
.ptitle{font-weight:700;line-height:1.3;word-break:break-word}
.meta{font-size:12.5px;color:var(--mute);margin-top:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:#A6430A}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-weight:800;padding:15px 26px;border-radius:99px;box-shadow:0 8px 24px rgba(232,89,12,.35);display:flex;align-items:center;gap:8px;z-index:30;font-size:15.5px;white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px;line-height:1.5}
.veil{position:fixed;inset:0;background:rgba(20,22,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(28px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;background:#CFC8BD;border-radius:9px;margin:4px auto 12px}
label.lb{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;font-size:16px}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--card);border:1px solid var(--line);text-decoration:none;position:relative}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad)}
.btn.full{width:100%}
.btn[disabled]{opacity:.55}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btns .btn{flex:1}
.media-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mp{background:var(--card);border:1.5px dashed #CFC8BD;border-radius:12px;padding:13px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--mute);position:relative;cursor:pointer}
.mp input{position:absolute;inset:0;opacity:0;cursor:pointer}
.mp svg{display:block;margin:0 auto 5px}
.mp.rec{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.previews .thumb{width:74px;height:74px}
.previews .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;display:grid;place-items:center}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery .thumb{width:100%;height:auto;aspect-ratio:1}
.big-media{width:100%;border-radius:12px;max-height:380px;object-fit:contain;background:#222;display:block}
audio{width:100%;max-width:280px;height:40px;margin-top:4px}
.timeline{border-left:2px solid var(--line);margin:6px 0 0 8px;padding-left:14px}
.tl{position:relative;padding-bottom:14px}
.tl:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl .who{font-weight:700;font-size:13.5px}.tl .when{font-size:12px;color:var(--mute)}
.tl p{margin-top:3px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.tl .big-media{margin-top:6px;max-height:240px}
.msg{display:flex;flex-direction:column;margin-bottom:10px;max-width:86%}
.msg.me{margin-left:auto;align-items:flex-end}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.me .bubble{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:14px 14px 4px 14px}
.msg.sys{max-width:100%;align-items:center}
.msg.sys .bubble{background:#EAE5DD;border-color:#E0DAD0;color:#4A4F55;font-weight:600;font-size:13px;border-radius:12px;text-align:center}
.msg.sys.alert .bubble{background:var(--bad-soft);border-color:#F1C4C0;color:var(--bad)}
.mwho{font-size:11.5px;color:var(--mute);margin:0 4px 3px;font-weight:600}
.mention{background:var(--acc-soft);color:#A6430A;border-radius:5px;padding:0 4px;font-weight:700}
.msg.me .mention{background:#4A3426;color:#FFB98C}
.bubble img,.bubble video{max-width:240px;width:100%;border-radius:10px;display:block;margin-top:6px}
.bubble a.file{display:flex;gap:6px;align-items:center;margin-top:4px;font-weight:700}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:30}
.composer .inp{border-radius:99px;padding:11px 15px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;position:relative;cursor:pointer}
.icon-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.icon-btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.icon-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.quick{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.doc{display:flex;gap:12px;align-items:center}
.dicon{width:42px;height:48px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:none;text-transform:uppercase}
.person{display:flex;align-items:center;gap:12px}
.lv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.lv{position:relative;overflow:hidden;border-radius:12px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.chip svg,.pill svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:6px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:14px}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s ease;max-width:92%;text-align:center}
.toast.err{background:var(--bad)}
.cr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;font-size:14px;line-height:1.5}
.cr h3{font-size:15px;margin:16px 0 6px}.cr table{width:100%;border-collapse:collapse;font-size:13px}
.cr td,.cr th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.cr .crimgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.cr .crimgs img{width:70px;height:70px;object-fit:cover;border-radius:6px}
.note{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.45}
.seg{display:flex;background:#EAE5DD;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.u-bad{color:var(--bad)}.seg button.on.u-warn{color:#8A5E00}.seg button.on.u-blue{color:var(--blue)}
.hero{padding:26px 4px 6px}
.hero h1{font-size:30px;line-height:1.12}
.hero p{font-size:16px;color:#3F454B;margin-top:12px;line-height:1.5}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.35}
.feat b{display:block;font-size:14px;margin-bottom:3px}
.linkbox{background:#F8F6F2;border:1px dashed #CFC8BD;border-radius:10px;padding:10px;font-size:12.5px;word-break:break-all;margin-top:8px;user-select:all}
.range{width:100%;accent-color:var(--acc)}
.spinner{width:22px;height:22px;border:3px solid #D9D2C7;border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:12px;color:var(--mute);padding:30px 16px 10px;line-height:1.5}
/* ================= PAGE DE PRÉSENTATION ================= */
.app.land{max-width:none;padding:0;background:#EDF1F4;overflow-x:hidden}
.land{--plan:#163A63;--plan2:#1F4F86;--calque:#EDF1F4;--encre:#0E1822;--jaune:#FFC72C;--signal:#E5484D;--vert:#2F9E6A;--gris:#5B6876;
  font-family:Archivo,Manrope,system-ui,sans-serif;color:var(--encre);font-stretch:100%}
.land a{text-decoration:none}
.land :focus-visible{outline:3px solid var(--jaune);outline-offset:3px;border-radius:6px}
.l-wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.l-top{display:flex;align-items:center;gap:14px;padding:22px 0}
.l-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;font-stretch:112%;color:var(--encre)}
.l-brand i{width:36px;height:36px;border-radius:9px;background:#163A63;box-shadow:0 0 0 1.5px rgba(255,255,255,.6);display:grid;place-items:center}
.l-top nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.l-top nav a{padding:9px 14px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--encre)}
.l-top nav a:hover{background:#DDE5EC}
.l-btn{display:inline-flex;align-items:center;gap:9px;padding:15px 24px;border-radius:12px;font-weight:700;font-size:16px;border:2px solid transparent;cursor:pointer;transition:transform .12s, box-shadow .12s}
.l-btn:active{transform:translateY(1px)}
.l-btn.j{background:var(--jaune);color:var(--encre);box-shadow:0 3px 0 #C99A10}
.l-btn.j:hover{box-shadow:0 5px 0 #C99A10;transform:translateY(-2px)}
.l-btn.o{border-color:var(--encre);color:var(--encre);background:transparent}
.l-btn.o:hover{background:var(--encre);color:#fff}
.l-btn.sm{padding:10px 16px;font-size:14.5px}

/* --- hero --- */
.l-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:56px;align-items:center;padding:34px 0 70px}
.l-hero h1{font-size:clamp(38px,5.2vw,66px);line-height:1.02;font-weight:800;font-stretch:118%;letter-spacing:-1.2px;max-width:13ch}
.l-hero p.lead{font-size:19px;line-height:1.55;color:#33404D;margin-top:22px;max-width:44ch}
.l-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.l-small{font-size:14px;color:var(--gris);margin-top:16px;line-height:1.5;max-width:46ch}

.plan{position:relative;background:var(--plan);border-radius:22px;aspect-ratio:1.18;overflow:hidden;box-shadow:0 30px 60px -28px rgba(22,58,99,.6)}
.plan:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:24px 24px}
.plan svg.murs{position:absolute;inset:7% 6% 12% 6%;width:88%;height:81%}
.plan .cartouche{position:absolute;right:16px;bottom:14px;border:1.5px solid rgba(255,255,255,.55);color:#DCE7F3;font-size:11.5px;line-height:1.35;padding:7px 10px;border-radius:4px;font-stretch:90%}
.plan .cartouche b{display:block;color:#fff;font-size:12.5px;font-stretch:110%}
.pin{position:absolute;display:flex;align-items:flex-start;gap:8px;animation:pose .55s cubic-bezier(.2,1.4,.4,1) both}
.pin .pt{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.3);border:2.5px solid #fff}
.pin .pt>*{transform:rotate(45deg)}
.pin .bulle{background:#fff;border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.35;max-width:200px;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);color:var(--encre)}
.pin .bulle b{display:block;font-size:12.8px}
.pin .bulle span{color:var(--gris)}
.pin .bulle .tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;font-style:normal}
@keyframes pose{from{opacity:0;transform:translateY(-26px) scale(.9)}}
.p1{left:9%;top:14%;animation-delay:.5s}.p2{left:47%;top:30%;animation-delay:1.25s}.p3{left:14%;top:58%;animation-delay:2s}.p4{left:55%;top:66%;animation-delay:2.75s}
@media (prefers-reduced-motion:reduce){.pin{animation:none}}

/* --- bande métiers --- */
.l-metiers{background:#fff;border-block:1px solid #D6DEE6;padding:22px 0;overflow:hidden}
.l-metiers .rail{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.l-metiers .m{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#33404D;width:78px;text-align:center}
.l-metiers p{text-align:center;font-size:14.5px;color:var(--gris);margin-bottom:16px}

/* --- sections --- */
.l-sec{padding:96px 0}
.l-sec h2,.l-offre h2{font-size:clamp(30px,3.4vw,44px);line-height:1.08;font-weight:800;font-stretch:115%;letter-spacing:-.8px;max-width:20ch}
.l-sec .intro,.l-offre .intro{font-size:18px;line-height:1.55;color:#33404D;margin-top:16px;max-width:56ch}

/* personnalisation */
.l-perso{background:var(--encre);color:#E8EEF4}
.l-perso h2{color:#fff}.l-perso .intro{color:#B9C5D1}
.perso-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;margin-top:48px;align-items:center}
.ctrl{background:#17242F;border:1px solid #273745;border-radius:18px;padding:26px}
.ctrl label{display:block;font-size:14px;font-weight:600;margin:0 0 8px;color:#CFDAE4}
.ctrl label+*{margin-bottom:22px}
.ctrl input[type=text]{width:100%;background:#0E1822;border:1.5px solid #304252;color:#fff;border-radius:10px;padding:13px 14px;font:inherit;font-size:16px;outline:none}
.ctrl input[type=text]:focus{border-color:var(--jaune)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px #304252}
.sw button.on{border-color:#fff}
.drop{display:flex;align-items:center;gap:14px;border:1.5px dashed #3A5064;border-radius:12px;padding:14px;position:relative;cursor:pointer;color:#B9C5D1;font-size:14px}
.drop:hover{border-color:var(--jaune)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .lg{width:48px;height:48px;border-radius:10px;background:#0E1822;display:grid;place-items:center;overflow:hidden;flex:none}
.drop .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.ctrl .hint{font-size:13px;color:#8FA1B2;line-height:1.5}

.tel{width:310px;max-width:100%;margin:0 auto;background:#0B131B;border-radius:40px;padding:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 0 0 2px #273745}
.ecran{background:#EDF1F4;border-radius:30px;overflow:hidden;color:var(--encre);font-family:Manrope,system-ui,sans-serif;min-height:560px}
.ecran .couv{height:118px;position:relative;background:var(--marque,#163A63);display:flex;align-items:flex-end;padding:14px}
.ecran .couv .logo{width:52px;height:52px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:19px;color:var(--marque,#163A63);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.ecran .couv .logo img{width:100%;height:100%;object-fit:contain}
.ecran .couv .qui{color:#fff;margin-left:10px;line-height:1.25}
.ecran .couv .qui small{display:block;font-size:11px;opacity:.85}
.ecran .couv .qui b{font-size:15px}
.ecran .corps{padding:14px}
.ecran h4{font-size:17px;font-weight:800;letter-spacing:-.2px}
.ecran .adr{font-size:12px;color:#5B6876;margin-top:2px}
.ecran .mot{background:#fff;border-radius:12px;padding:11px 12px;font-size:12.5px;line-height:1.45;margin-top:12px;border-left:4px solid var(--marque,#163A63)}
.ecran .tache{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px;font-weight:600}
.ecran .tache i{width:20px;height:20px;border-radius:6px;border:2px solid #C3CDD7;flex:none}
.ecran .tache.ok i{background:var(--vert);border-color:var(--vert)}
.ecran .tache small{display:block;font-weight:500;color:#5B6876;font-size:11.5px}
.ecran .bout{margin-top:14px;background:var(--marque,#163A63);color:#fff;text-align:center;font-weight:800;border-radius:99px;padding:13px;font-size:14px}

/* étapes */
.etapes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:52px;counter-reset:e}
.etape{border-top:3px solid var(--encre);padding-top:20px}
.etape:before{counter-increment:e;content:counter(e);display:block;font-size:54px;font-weight:800;font-stretch:125%;color:var(--plan2);line-height:1;margin-bottom:14px}
.etape h3{font-size:21px;font-weight:700;font-stretch:108%;margin-bottom:8px}
.etape p{font-size:16px;line-height:1.55;color:#33404D}

/* deux regards */
.regards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:48px}
.regard{border-radius:20px;padding:30px;background:#fff;border:1px solid #D6DEE6}
.regard.art{background:var(--jaune);border-color:var(--jaune)}
.regard h3{font-size:24px;font-weight:800;font-stretch:112%;margin-bottom:6px}
.regard .q{font-size:15px;color:#33404D;margin-bottom:18px}
.regard.art .q{color:#4A3B00}
.regard ul{list-style:none;display:grid;gap:12px}
.regard li{display:flex;gap:12px;font-size:16px;line-height:1.45}
.regard li svg{flex:none;margin-top:2px}

/* offre */
.l-offre{background:var(--plan);color:#fff;border-radius:28px;padding:64px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.l-offre:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.l-offre h2{color:#fff;position:relative}
.l-offre .intro{color:#C9D8E8;position:relative}
.l-offre .box{position:relative;background:#fff;color:var(--encre);border-radius:18px;padding:26px}
.l-offre .prix{font-size:44px;font-weight:800;font-stretch:120%;line-height:1}
.l-offre .prix small{font-size:15px;font-weight:600;color:var(--gris);font-stretch:100%}
.l-offre .box ul{list-style:none;margin:16px 0 22px;display:grid;gap:9px;font-size:15px}
.l-offre .box li:before{content:"✓";color:var(--vert);font-weight:800;margin-right:8px}
.l-foot{padding:40px 0 50px;font-size:13.5px;color:var(--gris);line-height:1.6;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.l-mine{background:#fff;border:1px solid #D6DEE6;border-radius:16px;padding:18px 20px;margin-top:-30px;margin-bottom:40px}
.l-mine a{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #E6ECF1;color:var(--encre);font-weight:600}
.l-mine a:first-of-type{border-top:none}

@media (max-width:900px){
  .l-hero,.perso-grid,.l-offre{grid-template-columns:1fr}
  .l-hero{gap:36px;padding-top:10px}
  .etapes,.regards{grid-template-columns:1fr}
  .l-sec{padding:70px 0}
  .l-offre{padding:36px 24px}
  .l-top nav a.hide-m{display:none}
  .l-brand{font-size:17px;white-space:nowrap}
  .pin .bulle{max-width:150px;font-size:11.5px}
}
@media (max-width:560px){
  .l-wrap{padding:0 18px}
  .pin .bulle span{display:none}
  .l-top nav .l-btn{display:none}
  .p2{left:40%}.p4{left:44%}
}

/* ================= MARQUE DU PILOTE DANS L'APPLI ================= */
.marque{border-radius:18px;overflow:hidden;margin-bottom:14px;background:var(--card);border:1px solid var(--line)}
.marque .couv{height:110px;background:var(--acc) center/cover no-repeat;position:relative}
.marque .couv:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}

.marque .mot{margin:0 14px 14px;font-size:13.5px;line-height:1.5;background:#F8F6F2;border-left:4px solid var(--acc);padding:10px 12px;border-radius:8px;white-space:pre-wrap}

.up{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px dashed #CFC8BD;border-radius:12px;padding:12px;position:relative;cursor:pointer}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ====================== AUDIO RECORDER ====================== */
const REC = {mr:null, chunks:[], onDone:null, t0:0};
async function startRec(onDone){
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Enregistrement vocal non disponible sur ce téléphone', true); return false; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    REC.mr = new MediaRecorder(stream, type?{mimeType:type}:undefined); REC.chunks=[]; REC.onDone=onDone; REC.t0=Date.now();
    REC.mr.ondataavailable = e => e.data.size && REC.chunks.push(e.data);
    REC.mr.onstop = () => { stream.getTracks().forEach(t=>t.stop()); const mt = REC.mr.mimeType || 'audio/webm';
      const blob = new Blob(REC.chunks, {type:mt}); const ext = mt.includes('mp4')?'m4a':'webm';
      const f = new File([blob], `vocal-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.${ext}`, {type:mt.split(';')[0]});
      REC.mr = null; if(Date.now()-REC.t0 > 700) REC.onDone && REC.onDone(f); };
    REC.mr.start(); return true;
  }catch(e){ toast('Micro refusé : autorisez-le dans les réglages du navigateur', true); return false; }
}
function stopRec(){ if(REC.mr && REC.mr.state!=='inactive') REC.mr.stop(); }

/* Recherche automatique dans l'annuaire officiel des entreprises (recherche-entreprises.api.gouv.fr, gratuit, sans clé). */
let SIRET = {ok:false};
const NAF_PILOTES = {'71.11Z':'Activités d’architecture','71.12B':'Ingénierie, études techniques (BE / maîtrise d’œuvre)','71.12A':'Géomètre-expert','41.20A':'Construction de maisons individuelles','41.20B':'Construction d’autres bâtiments','41.10A':'Promotion immobilière de logements','41.10B':'Promotion immobilière de bureaux','41.10C':'Promotion immobilière d’autres bâtiments','41.10D':'Supports juridiques de programmes','74.10Z':'Activités spécialisées de design'};
const capi = t => String(t||'').toLowerCase().replace(/(^|[\s-])([a-zà-ÿ])/g, (m,a,b)=>a+b.toUpperCase());
let siretTimer;
function siretSaisi(v){
  const n = String(v||'').replace(/\D/g,''); const info = $('#aSiretInfo'); SIRET = {ok:false};
  clearTimeout(siretTimer);
  if(!n){ info.innerHTML = 'Pas de SIRET sous la main ? Remplissez simplement les champs ci-dessous.'; return; }
  if(n.length !== 14 && n.length !== 9){ info.innerHTML = n.length < 14 ? `${n.length} chiffre${n.length>1?'s':''} sur 14…` : 'Le SIRET fait 14 chiffres.'; return; }
  info.innerHTML = 'Recherche de votre entreprise…';
  siretTimer = setTimeout(async () => {
    try{
      const r = await fetch('https://recherche-entreprises.api.gouv.fr/search?q=' + n + '&per_page=1');
      const d = await r.json(); const e = d && d.results && d.results[0];
      if(!e || (n.length === 14 && !String(JSON.stringify(e)).includes(n))){ info.innerHTML = 'Numéro introuvable dans l’annuaire officiel. Vérifiez-le, ou remplissez les champs à la main.'; return; }
      const et = (e.matching_etablissements||[]).find(x => x.siret === n) || e.siege || {};
      const nom = e.nom_raison_sociale || e.nom_complet || '';
      const dir = (e.dirigeants||[]).find(x => x.type_dirigeant === 'personne physique' && x.nom);
      const naf = et.activite_principale || e.activite_principale || '';
      SIRET = {ok:true, siret: et.siret || n, adresse: et.adresse || '', naf: naf + (NAF_PILOTES[naf] ? ' – ' + NAF_PILOTES[naf] : '')};
      if($('#aEnt')) $('#aEnt').value = capi(nom);
      if($('#aNom') && !$('#aNom').value && dir) $('#aNom').value = capi(String(dir.prenoms||'').split(' ')[0] + ' ' + dir.nom);
      const ferme = (e.etat_administratif === 'C' || et.etat_administratif === 'F');
      info.innerHTML = `<span style="color:${ferme?'var(--signal,#E5484D)':'#2F8F5B'};font-weight:700">${ferme?'⚠️ Établissement fermé':'✓ Entreprise trouvée'}</span> : <b>${esc(capi(nom))}</b>${et.adresse?'<br>'+esc(et.adresse):''}${NAF_PILOTES[naf]?'<br>'+esc(NAF_PILOTES[naf]):''}<br><span style="color:var(--mute)">Vérifiez ou corrigez les champs ci-dessous.</span>`;
    }catch(err){ info.innerHTML = 'Recherche impossible pour le moment : remplissez les champs à la main.'; }
  }, 300);
}

const csvCell = v => { if(v==null) return ''; if(typeof v==='object') v = JSON.stringify(v); v = String(v); return /[";\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
function toCsv(rows){ if(!rows || !rows.length) return ''; const cols = [...new Set(rows.flatMap(r=>Object.keys(r)))]; return '﻿'+[cols.join(';'), ...rows.map(r=>cols.map(c=>csvCell(r[c])).join(';'))].join('\r\n'); }
const nomFichier = s => String(s||'sans-nom').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'sans-nom';

async function sauvegarder(){
  SAUV.enCours = true; SAUV.etat = 'Récupération de vos données…'; render();
  try{
    if(!window.JSZip) await chargerScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    const d = await rpc('cc_export', {p_token:compteToken()});
    const zip = new JSZip(), jour = new Date().toISOString().slice(0,10);
    zip.file('donnees-completes.json', JSON.stringify(d, null, 2));
    zip.file('professionnels.csv', toCsv(d.professionnels));
    zip.file('historique-compte.csv', toCsv(d.journal));
    zip.file('LISEZ-MOI.txt', `Sauvegarde Contact Chantier du ${new Date().toLocaleString('fr-FR')}\r\nCompte : ${d.compte.email}\r\n\r\ndonnees-completes.json : toutes les données, réimportables.\r\nUn dossier par chantier : fichiers CSV lisibles dans Excel (séparateur point-virgule) et, si demandé, les fichiers joints.\r\nLes dates sont en temps universel (UTC).\r\n`);
    const fichiers = [];
    d.chantiers.forEach((c, i) => {
      const dos = zip.folder(String(i+1).padStart(2,'0')+'-'+nomFichier(c.chantier.nom));
      ['intervenants','etapes','problemes','conversations','messages','documents','medias'].forEach(k => { if(c[k].length) dos.file(k+'.csv', toCsv(c[k])); });
      dos.file('chantier.json', JSON.stringify(c, null, 2));
      if(SAUV.fichiers) [...c.documents.map(x=>({...x, rep:'documents'})), ...c.medias.map(x=>({...x, rep:'photos-et-videos'}))].forEach(x => { if(/^https:\/\//.test(x.url||'')) fichiers.push({dos, x}); });
    });
    let ok = 0, ko = 0;
    for(const {dos, x} of fichiers){
      SAUV.etat = `Fichiers : ${ok+ko+1} / ${fichiers.length}`; render();
      try{ const r = await fetch(x.url); if(!r.ok) throw 0; const ext = (x.url.split('?')[0].split('.').pop()||'bin').slice(0,5);
        dos.folder(x.rep).file(nomFichier(x.created_at?.slice(0,10)+'-'+(x.nom||x.id)).replace(/\.\w{1,5}$/,'')+'.'+ext, await r.blob()); ok++; }
      catch(e){ ko++; }
    }
    SAUV.etat = 'Compression…'; render();
    const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
    const nom = `contact-chantier-sauvegarde-${jour}.zip`;
    if(window.showSaveFilePicker){
      try{ const h = await showSaveFilePicker({suggestedName:nom, types:[{description:'Archive ZIP', accept:{'application/zip':['.zip']}}]});
        const w = await h.createWritable(); await w.write(blob); await w.close(); }
      catch(e){ if(e.name==='AbortError'){ SAUV.etat = 'Enregistrement annulé.'; return; } throw e; }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    }
    SAUV.etat = `Sauvegarde terminée : ${d.chantiers.length} chantier${d.chantiers.length>1?'s':''}${SAUV.fichiers?`, ${ok} fichier${ok>1?'s':''}${ko?` (${ko} introuvable${ko>1?'s':''})`:''}`:''}, ${(blob.size/1e6).toFixed(1)} Mo.`;
    toast('Sauvegarde enregistrée');
  }catch(e){ fail(e); SAUV.etat = ''; }
  finally{ SAUV.enCours = false; render(); }
}

/* ====================== CCTP : découpage par lot ====================== */
const CCTP_GENERAL = /g[ée]n[ée]ralit|^objet|objet du (pr[ée]sent|march)|normes?|r[ée]glement|documents? (de r[ée]f|contractuel)|prescriptions? g[ée]n|d[ée]finitions?|consistance des|limites? de prestation|nettoyage|sommaire|pr[ée]ambule|textes? de r[ée]f|r[ée]ception des (supports|travaux)|garanties?$|^conditions? g[ée]n|^d[ée]signation|^pr[ée]sentation/i;
const RX_TOC = /(\.{4,}|…{2,}|\s{3,})\s*\d{1,3}\s*$/;
const RX_LOT = /^\s*(?:LOT|Lot)\s*(?:N\s*[°ºo]\.?\s*)?(\d{1,2}(?:\s?[A-Z](?![a-z]))?)\s*(?:[-–—:.]|\s)\s*(.{2,90}?)\s*$/;
const RX_ART = /^\s*(?:(?:Article|ARTICLE|Art\.?|ART\.?)\s*)?((?:\d{1,2}|[A-Z])(?:\.\d{1,3}){1,5})\.?\s*[-–—:)]?\s+(\S.{1,160})$/;

function cctpNettoyer(lignes){
  const brut = lignes.map(l=>String(l||'').replace(/ /g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  // en-têtes / pieds de page répétés (≥ 4 fois à l'identique, courts)
  const freq = {}; brut.forEach(l=>{ if(l.length<90) freq[l]=(freq[l]||0)+1; });
  return brut.filter(l => !(freq[l]>=4 && !RX_ART.test(l)) && !/^(page\s*)?\d{1,3}\s*(\/|sur)\s*\d{1,3}$/i.test(l) && !/^\d{1,3}$/.test(l));
}
function cctpLot(intitule, lotsDispo){
  // rattache l'intitulé du lot à un corps de métier de l'appli
  const ix = t => { const n = norm(t); return METIERS.findIndex(([k])=>k.some(w=>n.includes(w))); };
  const n = norm(intitule);
  if(/gros.?oeuvre|maconn|beton arme|fondation/.test(n)) return lotsDispo.find(l=>/ma[cç]on/i.test(l)) || 'Maçonnerie';
  if(/platr|cloison|doublage|faux.?plafond/.test(n)) return lotsDispo.find(l=>/pl[aâ]tr/i.test(l)) || 'Plâtrerie';
  if(/cvc|chauff|ventil|climat|vmc/.test(n) && /plomb|sanit/.test(n)) return lotsDispo.find(l=>/plomb/i.test(l)) || 'Plomberie';
  const i = ix(intitule);
  if(i >= 0){ const l = lotsDispo.find(x=>ix(x)===i); if(l) return l; }
  const propre = intitule.toLowerCase().replace(/(^|[\s\-/(])\p{L}/gu, s=>s.toUpperCase()).replace(/\s+/g,' ').trim();
  return propre.slice(0,40);
}
function cctpDecouper(lignesBrutes, nomFichier, lotsDispo){
  const L = cctpNettoyer(lignesBrutes).filter(l=>!RX_TOC.test(l));
  // 1. repérage des lots
  const lots = []; let cur = null;
  const lotDuFichier = () => { const m = String(nomFichier||'').match(/lot\s*[_\- ]?(\d{1,2})[_\- ]*(.*)\.\w+$/i); return {num: m?m[1]:'', titre: m ? m[2].replace(/[_\-]+/g,' ').trim() : String(nomFichier||'CCTP').replace(/\.\w+$/,'').replace(/[_\-]+/g,' ') }; };
  for(const l of L){
    const m = l.match(RX_LOT);
    if(m && l.length < 100 && !/[.;,]$/.test(m[2]) && !/^(du|de|des|le|la|les|et|en|au|aux)\b/i.test(m[2])){
      const num = m[1].replace(/\s/g,'').replace(/^0+(?=\d)/,'');
      const titre = m[2].replace(/^[-–—:.\s]+/,'').trim();
      cur = lots.find(x=>x.num===num);
      if(!cur){ cur = {num, titre, lignes:[]}; lots.push(cur); }
      else if(titre.length > cur.titre.length && titre.length < 70) cur.titre = titre;
      continue;
    }
    if(!cur){ const f = lotDuFichier(); cur = {num:f.num, titre:f.titre || 'CCTP', lignes:[], implicite:true}; lots.push(cur); }
    cur.lignes.push(l);
  }
  // un « lot implicite » vide (page de garde avant le 1er lot) est retiré
  const res = [];
  for(const lot of lots){
    // 2. articles numérotés
    const arts = []; let a = null;
    for(const l of lot.lignes){
      const m = l.match(RX_ART);
      const titreOk = m && m[2].length <= 160 && !/[,;]$/.test(m[2]) && !/^\d/.test(m[2]) && !/^(mm|cm|m|kg|m2|m²|m3|°|%)\b/i.test(m[2]);
      if(titreOk){ a = {ref:m[1], titre:m[2].replace(/[.:]$/,'').trim(), texte:[]}; arts.push(a); continue; }
      if(a) a.texte.push(l);
    }
    // ne garder que les articles « feuilles » ; les titres parents servent d'intitulé de section
    const feuilles = arts.filter((x,i)=>!arts.some((y,j)=>j!==i && y.ref.startsWith(x.ref+'.')));
    const parent = x => { const p = x.ref.split('.').slice(0,-1).join('.'); const pa = arts.find(y=>y.ref===p); return pa ? pa.titre : ''; };
    let articles = feuilles.map(x=>{
      const sec = parent(x);
      return {ref:x.ref, titre:x.titre, section:sec, detail:x.texte.join('\n').slice(0,6000), garder: !CCTP_GENERAL.test(x.titre) && !CCTP_GENERAL.test(sec)};
    });
    if(!articles.length && lot.lignes.length > 3){
      // CCTP sans numérotation : on découpe sur les lignes en MAJUSCULES
      let b = null; articles = [];
      for(const l of lot.lignes){
        if(l.length < 90 && l === l.toUpperCase() && /[A-ZÀ-Ý]{4}/.test(l)){ b = {ref:'', titre:l.charAt(0)+l.slice(1).toLowerCase(), section:'', detail:'', garder:!CCTP_GENERAL.test(l)}; articles.push(b); }
        else if(b) b.detail = (b.detail ? b.detail+'\n' : '') + l;
      }
    }
    if(!articles.length) continue;
    res.push({num:lot.num, intitule:lot.titre, lot:cctpLot(lot.titre, lotsDispo||[]), articles, garder:true});
  }
  return res;
}

/* ---------- lecture des fichiers (PDF, Word, texte) ---------- */
const PDFJS_V = '4.10.38';
async function cctpLirePdf(buf){
  const pdfjs = await import(`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.min.mjs`);
  pdfjs.GlobalWorkerOptions.workerSrc = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.worker.min.mjs`;
  const doc = await pdfjs.getDocument({data:buf}).promise;
  const lignes = [];
  for(let p=1; p<=doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    let y = null, x = 0, cur = '';
    for(const it of tc.items){
      if(!('str' in it)) continue;
      const iy = it.transform[5], ix = it.transform[4];
      if(y !== null && Math.abs(iy - y) > 2.5){ lignes.push(cur); cur = ''; }
      else if(cur && ix - x > 1.5 && !cur.endsWith(' ') && !it.str.startsWith(' ')) cur += ' ';
      cur += it.str; y = iy; x = ix + (it.width||0);
      if(it.hasEOL){ lignes.push(cur); cur = ''; y = null; }
    }
    if(cur) lignes.push(cur);
    $('#cctpEtat') && ($('#cctpEtat').textContent = `Lecture… page ${p} / ${doc.numPages}`);
  }
  return lignes;
}
function chargerScript(src){ return new Promise((ok, ko)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Chargement impossible, vérifiez la connexion')); document.head.appendChild(s); }); }
async function cctpLireDocx(buf){
  await chargerScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
  const html = (await window.mammoth.convertToHtml({arrayBuffer:buf})).value;
  const d = new DOMParser().parseFromString(html, 'text/html');
  const blocs = [...d.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,td')].filter(e=>!e.closest('li p, td p') || e.tagName!=='P');
  const titres = blocs.filter(e=>/^H\d$/.test(e.tagName));
  if(!titres.length) return (await window.mammoth.extractRawText({arrayBuffer:buf})).value.split('\n');
  // les titres Word numérotés automatiquement perdent leur numéro : on le recrée à partir des niveaux
  const niv = [...new Set(titres.map(e=>+e.tagName[1]))].sort();
  const c = [0,0,0,0,0,0], lignes = [];
  for(const e of blocs){
    const t = e.textContent.replace(/\s+/g,' ').trim(); if(!t) continue;
    if(!/^H\d$/.test(e.tagName)){ lignes.push(t); continue; }
    const k = niv.indexOf(+e.tagName[1]);
    c[k]++; for(let j=k+1;j<c.length;j++) c[j]=0;
    if(k===0){ lignes.push(RX_LOT.test(t) || !/[a-z]{3}/i.test(t) ? t : (metier(t)[2] || /lot/i.test(t) ? (/^lot/i.test(t)?t:`LOT ${c[0]} - ${t}`) : t)); continue; }
    if(/^\d+(\.\d+)+\s/.test(t)) lignes.push(t);
    else lignes.push(`${c.slice(0,k+1).map((v,i)=>i===0?c[0]:v).join('.')} ${t}`);
  }
  return lignes;
}
async function cctpLire(file){
  const buf = await file.arrayBuffer(), n = (file.name||'').toLowerCase();
  if(n.endsWith('.pdf') || file.type==='application/pdf') return cctpLirePdf(buf);
  if(n.endsWith('.docx')) return cctpLireDocx(buf);
  if(n.endsWith('.txt')) return new TextDecoder().decode(buf).split('\n');
  if(n.endsWith('.doc')) throw new Error('Ancien format Word (.doc) : enregistrez le fichier en .docx ou en PDF');
  throw new Error('Format non reconnu : choisissez un PDF ou un Word (.docx)');
}

/* ---------- IMPORT D'UN DEVIS (artisan avec ses équipes) ----------
   Le devis est lu dans le navigateur (rien n'est envoyé ailleurs), les prix, quantités et totaux sont retirés,
   chaque ligne de travaux devient une tâche confiée à une équipe. Le fichier du devis n'est jamais joint au chantier. */
let DV = null; // {lignes:[{titre, detail, section, equipe, garder}], nom}
const RX_DV_BRUIT = /(^|\s)(date d.?(?:émission|expiration|échéance)|total|sous[- ]?total|montant|net à payer|tva|t\.v\.a|h\.?t\.?\b|t\.?t\.?c\.?\b|acompte|iban|bic|swift|siret|siren|rcs|capital|ape|naf|code banque|rib|conditions? (de|générales)|validité|bon pour accord|signature|date d.?échéance|devis n|facture n|n° de devis|référence client|page \d|désignation|quantité|prix unit|p\.u|remise|escompte|pénalit|indemnité forfaitaire|garantie décennale|assurance|tél|tel\.|e-?mail|www\.|@)/i;
const RX_DV_NOMBRE = /\s+(?:[-+]?\d{1,3}(?:[\s  .]\d{3})*(?:[.,]\d+)?|\d+(?:[.,]\d+)?)\s*(?:€|eur|euros?|%|ht|ttc|u\.?|un\.?|unités?|pce|pièces?|ens\.?|ensemble|forfait|fft|ft|m²|m2|m³|m3|ml|m|h|heures?|j|jours?|kg|t|l)?\.?$/i;
function devisNettoyer(t){
  let x = String(t||'').replace(/\s+/g,' ').trim(), avaitChiffres = false, prev;
  do { prev = x; x = x.replace(RX_DV_NOMBRE, '').replace(/\s*[|;:]\s*$/,'').trim(); if(x !== prev) avaitChiffres = true; } while(x !== prev && x);
  x = x.replace(/^\d+(?:[.,]\d+)*\s*[-–.)]?\s+(?=[A-Za-zÀ-ÿ])/, ''); // numéro de ligne en tête
  return {texte: x, chiffre: avaitChiffres};
}
const RX_DV_ENTETE = /^(?:désignation|description|libellé|produits?|prestations?|articles?|détail des travaux|nature des travaux)\b/i;
const RX_DV_FIN = /^(?:total|sous[- ]?total|montant total|net à payer|récapitulatif|mentions? spéciales?|conditions|non compris|ce devis (?:comprend|ne comprend|est valable)|modalités|règlement|paiement|bon pour accord|taux|base ht)/i;
const RX_DV_ADRESSE = /\b(?:rue|route|chemin|avenue|av\.|impasse|allée|boulevard|bd|place|lieu[- ]dit|cedex|zone|za|zi|bp)\b|\b\d{5}\b/i;
function devisDecouper(lignesBrutes, nomFichier){
  const lignes = lignesBrutes.map(l => String(l||'').replace(/\s+/g,' ').trim()).filter(Boolean);
  const avecEntete = lignes.some(l => RX_DV_ENTETE.test(l));
  const out = []; let section = '', debut = !avecEntete, fin = false;
  for(const b of lignes){
    if(fin) break;
    if(!debut){ if(RX_DV_ENTETE.test(b)) debut = true; continue; }
    if(RX_DV_FIN.test(b)){ if(out.length) fin = true; continue; }
    if(RX_DV_BRUIT.test(b)) continue;
    const {texte, chiffre} = devisNettoyer(b);
    if(!/[A-Za-zÀ-ÿ]{3}/.test(texte) || texte.length < 4) continue;
    const lettres = texte.replace(/[^A-Za-zÀ-ÿ]/g,'');
    if(!chiffre && texte.length <= 60 && lettres.length >= 4 && lettres === lettres.toUpperCase() && !RX_DV_ADRESSE.test(texte)){
      section = texte.charAt(0) + texte.slice(1).toLowerCase(); continue; }
    if(chiffre) out.push({titre: texte.slice(0,200), detail:'', section, equipe: section || 'Équipe 1', garder: true});
    else if(out.length){ const d = out[out.length-1]; if(d.detail.length < 1500) d.detail += (d.detail?'\n':'') + texte; }
  }
  // Devis sans montants sur les lignes (devis « au forfait ») : on propose les lignes descriptives, à trier.
  if(!out.length){ let go = !avecEntete; for(const t of lignes){ if(!go){ if(RX_DV_ENTETE.test(t)) go = true; continue; } if(RX_DV_FIN.test(t)) break;
    if(t.length >= 6 && /[A-Za-zÀ-ÿ]{3}/.test(t) && !RX_DV_BRUIT.test(t)) out.push({titre:t.slice(0,200), detail:'', section:'', equipe:'Équipe 1', garder:true}); } }
  return out;
}
function devisOuvrir(){ DV = {lignes:[], nom:'', toutes:''}; devisDessiner(); }

  sheet(h); const s2 = document.querySelector('.sheet'); if(s2) s2.scrollTop = sc;
}

/* ---------- IMPORT D'UNE LISTE D'ARTISANS (copier-coller) ---------- */
let IMP = null;
const RX_MAIL = /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;
const RX_TEL = /(?:\+33\s?|0)[1-9](?:[\s.\-]?\d{2}){4}/;
const RX_ADR = /\b\d{5}\b|^\s*\d{1,4}\s*(bis|ter)?\s*,?\s*(rue|av|avenue|bd|boulevard|chemin|route|all[ée]e|impasse|place|quai|cours|lieu|za|zi|zac|parc|hameau|r[ée]sidence|lot\.?|lotissement)\b|\b(rue|avenue|boulevard|chemin|route|impasse|all[ée]e)\b/i;
const RX_SOC = /\b(sarl|sas|sasu|eurl|sa|sci|ets|[ée]tablissements|entreprise|soci[ée]t[ée]|&|et fils|groupe)\b/i;
function estMetier(t){ const n = norm(t); if(!n || n.length>40) return null; const l = lotsCourants().find(x=>norm(x)===n || n.includes(norm(x))); if(l) return l; const i = METIERS.findIndex(([k])=>k.some(w=>n.includes(w))); if(i<0) return null; return lotsCourants().find(x=>METIERS.findIndex(([k])=>k.some(w=>norm(x).includes(w)))===i) || t.trim(); }
function imporAnalyser(txt){
  const lignes = String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lignes.length) return [];
  const sep = l => l.includes('\t') ? '\t' : (l.split(';').length>2 ? ';' : (l.split(',').length>2 && !RX_ADR.test(l) ? ',' : null));
  // ligne d'en-tête ?
  const s0 = sep(lignes[0]); let cols = null;
  if(s0){ const h = lignes[0].split(s0).map(c=>norm(c)); if(h.some(c=>/^(nom|name|contact)/.test(c)) && h.some(c=>/tel|mail|metier|lot|adresse/.test(c))){
    cols = h.map(c=> /mail/.test(c)?'email' : /tel|portable|mobile|gsm/.test(c)?'tel' : /metier|lot|activite|specialite|corps/.test(c)?'metier' : /adresse|ville|cp|code postal/.test(c)?'adresse' : /entreprise|societe|raison/.test(c)?'entreprise' : /prenom/.test(c)?'prenom' : /nom|contact|name/.test(c)?'nom' : null);
    lignes.shift(); } }
  return lignes.map(l=>{
    const p = {nom:'', metier:'', tel:'', email:'', adresse:'', entreprise:'', garder:true};
    const s = sep(l);
    if(cols && s){ l.split(s).forEach((c,i)=>{ const k = cols[i]; c = c.trim(); if(!k||!c) return; if(k==='prenom') p.nom = (c+' '+p.nom).trim(); else if(k==='adresse') p.adresse = (p.adresse?p.adresse+' ':'')+c; else if(k==='nom') p.nom = (p.nom+' '+c).trim(); else if(k==='metier') p.metier = estMetier(c)||c; else p[k] = c; }); }
    else {
      let cells = s ? l.split(s).map(c=>c.trim()).filter(Boolean) : null;
      if(!cells){ // texte libre : on extrait mail, téléphone, métier
        let t = l; const m = t.match(RX_MAIL); if(m){ p.email = m[0]; t = t.replace(m[0],' '); }
        const tl = t.match(RX_TEL); if(tl){ p.tel = tl[0]; t = t.replace(tl[0],' '); }
        const ad = t.match(/\d{1,4}\s*(bis|ter)?\s*,?\s*(rue|avenue|bd|boulevard|chemin|route|all[ée]e|impasse|place|lieu-dit)\b.*$/i) || t.match(/\b\d{5}\b.*$/);
        if(ad){ p.adresse = ad[0].trim(); t = t.replace(ad[0],' '); }
        cells = t.split(/\s[-–—|·:]\s|\s{2,}/).map(c=>c.trim()).filter(Boolean);
        if(cells.length===1){ const w = cells[0].split(/\s+/); const i = w.findIndex(x=>estMetier(x)); if(i>=0){ p.metier = estMetier(w[i]); w.splice(i,1); } cells = [w.join(' ')]; }
      }
      const reste = [];
      for(const c of cells){
        if(!p.email && RX_MAIL.test(c)){ p.email = c.match(RX_MAIL)[0]; continue; }
        if(!p.tel && RX_TEL.test(c) && c.replace(/\D/g,'').length <= 13){ p.tel = c.match(RX_TEL)[0]; continue; }
        if(!p.metier && estMetier(c)){ p.metier = estMetier(c); continue; }
        if(!p.adresse && RX_ADR.test(c)){ p.adresse = c; continue; }
        reste.push(c);
      }
      const soc = reste.findIndex(c=>RX_SOC.test(c));
      if(soc>=0 && reste.length>1){ p.entreprise = reste.splice(soc,1)[0]; }
      p.nom = reste.shift() || p.entreprise || '';
      if(!p.entreprise && reste.length) p.entreprise = reste.shift();
      if(!p.adresse && reste.length) p.adresse = reste.join(', ');
    }
    if(p.tel) p.tel = p.tel.replace(/\s+/g,' ').trim();
    p.garder = !!p.nom && !!(p.tel || p.email);
    return p;
  });
}

    h += `<div class="card tap prob" onclick="openProb('${p.id}')">${thumb(md, lotsOf(p)[0]||'Autre')}
      <div style="flex:1;min-width:0"><div class="ptitle">${esc(p.titre)}</div>
      <div class="meta">${p.zone?esc(p.zone)+' · ':''}${esc(M(p.auteur_id).nom.split(' ')[0])} · ${ago(p.created_at)}${p.echeance?` · <span style="${retard?'color:var(--bad);font-weight:700':''}">échéance ${dateFr(p.echeance)}${retard?' (en retard)':''}</span>`:''}</div>
      <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">${lotsOf(p).map(lotPill).join('')}<span class="pill ${URG[p.urgence][1]}">${URG[p.urgence][0]}</span><span class="pill ${ST[p.statut][1]}">${ST[p.statut][0]}</span>${nbm?`<span class="pill p-mute">💬 ${nbm}</span>`:''}</div></div></div>`;
  });
  return h;
}

}
function drawNew(){

  <div style="flex:1"><label class="lb">Échéance</label><input class="inp" type="date" value="${esc(draft.echeance)}" onchange="draft.echeance=this.value"></div></div>

  <div class="btns"><button class="btn" onclick="cancelDraft()">Annuler</button><button class="btn pri" id="pBtn" onclick="saveProb()">Envoyer${draft.lots.length?' à '+draft.lots.length+' lot'+(draft.lots.length>1?'s':''):''}</button></div>`);
}
function toggleLot(l){ const i = draft.lots.indexOf(l); if(i<0) draft.lots.push(l); else draft.lots.splice(i,1); drawNew(); }
function addFiles(inp){ [...inp.files].forEach(f=>draft.files.push({file:f, type:f.type.startsWith('video')?'vid':f.type.startsWith('image')?'img':f.type.startsWith('audio')?'aud':'doc', preview:URL.createObjectURL(f)})); drawNew(); }
async function recDraft(){
  if(REC.mr){ stopRec(); return; }
  const ok = await startRec(f=>{ draft.files.push({file:f, type:'aud'}); drawNew(); });
  if(ok){ drawNew(); toast('Enregistrement… touchez Stop pour terminer'); }
}
function cancelDraft(){ stopRec(); REC.onDone=null; closeSheet(); }
async function uploadAll(files, btn){
  const out = [];

}
async function saveProb(){

    toast(draft.lots.length?`Envoyé à ${draft.lots.join(', ')} · l’architecte le voit aussi`:'Problème enregistré');

}
function addReply(inp){ const v=$('#cIn').value; [...inp.files].forEach(f=>reply.files.push({file:f,type:f.type.startsWith('video')?'vid':f.type.startsWith('image')?'img':'doc',preview:URL.createObjectURL(f)})); drawProb(); $('#cIn').value=v; }
async function recReply(){ if(REC.mr){ stopRec(); return; } const ok = await startRec(f=>{ reply.files.push({file:f,type:'aud'}); drawProb(); }); if(ok) drawProb(); }

  if(!general && !c){ S.conv=null; return msgView(); }

    <label class="icon-btn" title="Photo, vidéo ou document">${I.clip}<input type="file" accept="image/*,video/*,application/pdf,.doc,.docx,.xls,.xlsx,.dwg" multiple onchange="addChat(this)"></label>

function newConv(){

function addChat(inp){ [...inp.files].forEach(f=>chatFiles.push({file:f,type:f.type.startsWith('video')?'vid':f.type.startsWith('image')?'img':'doc',preview:URL.createObjectURL(f)})); render(); }

  const b = $('#sBtn'); if(b) b.disabled = true;

    for(const d of docs){ const md = await upload(d.file, D().chantier.id); medias.push(md); if(!conv) await rpc('cc_ajouter_doc', {p_token:S.token, p_nom:(d.file.name||'Document').replace(/\.[^.]+$/,''), p_url:md.url}); }

}

function sheet(html){
  const deja = !!$('#layer').innerHTML;
  $('#layer').innerHTML = `<div class="veil" onclick="if(event.target===this){stopRec();closeSheet()}"><div class="sheet"><div class="grab"></div><button type="button" class="sheet-back" onclick="stopRec();closeSheet()">‹ Retour</button>${html}</div></div>`;
  if(!deja){ try{ history.pushState(Object.assign({}, history.state||{}, {sheet:true}), ''); }catch(e){} }
}
function closeSheet(){ $('#layer').innerHTML=''; }
/* bouton « précédent » du téléphone / du navigateur : ferme le volet ou revient à l'onglet d'avant */
let NAV_RESTO = false, NAV_CLE = '';
function navCle(){ return [S.route, S.route==='espace'?S.etab||'chantiers':'', S.route==='chantier'?(S.tab||'')+'|'+(S.conv||''):''].join('/'); }
function navMemo(){
  if(NAV_RESTO) return; const k = navCle(); if(k===NAV_CLE) return;
  const premier = !NAV_CLE; NAV_CLE = k;
  const st = {vue:k, etab:S.etab||'', tab:S.tab||'', conv:S.conv||null};
  try{ premier || !history.state || !history.state.vue ? history.replaceState(st, '') : history.pushState(st, ''); }catch(e){}
}
window.addEventListener('popstate', ev => {
  if($('#layer').innerHTML){ stopRec(); closeSheet(); return; }
  const st = ev.state;
  if(st && st.sheet && !st.vue){ history.back(); return; }
  if(!st || !st.vue) return;
  if(st.vue.split('/')[0] !== S.route) return;
  NAV_RESTO = true; S.etab = st.etab || 'chantiers'; S.tab = st.tab || S.tab; S.conv = st.conv || null; NAV_CLE = st.vue;
  if(S.route==='espace' && S.etab==='marque') MQ = null;
  if(S.route==='espace' && S.etab==='pros') loadPros(); else render();
  NAV_RESTO = false;
});


/* ====================== INSTALLER L'APPLI (PWA) ====================== */
let PWA_EVT = null;
function estInstallee(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function estIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function boutonInstaller(){
  if(estInstallee() || S.route==='auth') return '';
  return `<button class="hbtn" style="background:#FFC72C;color:#0E1822;border-color:#FFC72C;font-weight:800;margin-right:6px" onclick="installerAppli()">📲 Installer l’appli</button>`;
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA_EVT = e; });
window.addEventListener('appinstalled', () => { PWA_EVT = null; toast('Appli installée : retrouvez Contact Chantier sur votre écran d’accueil'); if(S.route==='chantier' || S.route==='espace') render(); });
async function installerAppli(){
  if(PWA_EVT){ const e = PWA_EVT; PWA_EVT = null; e.prompt(); try{ await e.userChoice; }catch(_){} render(); return; }
  const ua = navigator.userAgent, ios = estIOS(), android = /android/i.test(ua), mac = /Macintosh/.test(ua) && !ios, safari = /Safari/.test(ua) && !/Chrome|CriOS|Edg|Firefox|FxiOS/.test(ua);
  const cadre = (t) => `<span style="display:inline-block;border:1.5px solid currentColor;border-radius:6px;padding:0 6px;font-size:14px">${t}</span>`;
  let etapes;
  if(ios) etapes = `<li>Touchez le bouton <b>Partager</b> ${cadre('⬆︎')} en bas de Safari (en haut sur iPad)</li><li>Faites défiler et touchez <b>« Sur l’écran d’accueil »</b></li><li>Touchez <b>« Ajouter »</b> en haut à droite</li>`;
  else if(android) etapes = `<li>Touchez le menu ${cadre('⋮')} en haut à droite de Chrome</li><li>Touchez <b>« Installer l’application »</b> (ou « Ajouter à l’écran d’accueil »)</li><li>Confirmez avec <b>« Installer »</b></li>`;
  else if(mac && safari) etapes = `<li>Dans Safari, ouvrez le menu <b>Fichier</b></li><li>Cliquez sur <b>« Ajouter au Dock »</b></li><li>Confirmez avec <b>« Ajouter »</b></li>`;
  else etapes = `<li>Dans Chrome ou Edge, cliquez sur l’icône ${cadre('⊕')} à droite de la barre d’adresse</li><li>Ou ouvrez le menu ${cadre('⋮')} puis <b>« Caster, enregistrer et partager » › « Installer la page en tant qu’application »</b></li><li>Confirmez avec <b>« Installer »</b></li>`;
  sheet(`<h1 style="font-size:20px">📲 Installer Contact Chantier</h1>
    <p class="note" style="margin-top:6px">Une icône sur votre écran d’accueil, comme une vraie appli, sans passer par l’App Store ni le Play Store.${S.route==='chantier'?' Elle ouvrira directement ce chantier.':''}</p>
    <ol style="margin:16px 0 0 20px;line-height:1.9;font-size:16px">${etapes}</ol>
    ${ios ? '<p class="note" style="margin-top:14px">Le lien doit être ouvert dans Safari. S’il s’est ouvert dans une autre appli (SMS, mail…), touchez d’abord « Ouvrir dans Safari ».</p>' : ''}`);
}
