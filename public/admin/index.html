<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Administration Skyeco</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#F3F5F8;color:#14213D}.top{background:#14213D;color:#fff;padding:14px 20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.in{max-width:1100px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}.tabs button.on{background:#14213D;color:#fff;border-color:#14213D}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #E3E9EE}.btn{display:inline-block;background:#F5B700;color:#14213D;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;text-decoration:none}.btn.d{background:#14213D;color:#fff}.btn.l{background:#fff;border:1px solid #CBD5E1}
.hint{color:#5B6876;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#E0E7FF;color:#1E3160}
.code{font-size:28px;font-weight:900;letter-spacing:3px;background:#FFF4CC;border-radius:10px;padding:8px 14px;display:inline-block}video{width:100%;background:#000;border-radius:12px;max-height:78vh}input{padding:10px;border:1px solid #CBD5E1;border-radius:10px;width:320px;max-width:100%}
.nav{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}.nav:hover{background:rgba(255,255,255,.22)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#DC2626;margin-right:6px;animation:b 1s infinite}@keyframes b{50%{opacity:.3}}</style></head>
<body><div class="top"><span style="display:flex;gap:8px;align-items:center"><button class="nav" onclick="history.back()" title="Retour">◀ Retour</button><button class="nav" onclick="history.forward()" title="Avancer">Avancer ▶</button><a class="nav" href="/" title="Accueil skyeco.fr">🏠 skyeco.fr</a><span style="margin-left:6px">⚙️ Administration Skyeco</span></span><span style="display:flex;gap:10px;align-items:center"><span id="badge" class="hint" style="color:#C9D1E4"></span><a class="nav" href="/admin/standard.html">📞 Standard freelances</a><button class="nav" id="lock" onclick="verrouiller()">🔒 Verrouiller</button></span></div><div class="in" id="app"></div>
<script>
const SB='https://wklddwumirkdjkbxvzyj.supabase.co',K='sb_publishable_nacX-UD9ZwjpJ1C9Za8xxQ_tIhHW8nO',$=i=>document.getElementById(i);
const rpc=(f,b)=>fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
let A=new URLSearchParams(location.search).get('k')||localStorage.getItem('map_admin')||'';if(A){localStorage.setItem('map_admin',A);if(location.search)history.replaceState(null,'',location.pathname)}
let PIN=sessionStorage.getItem('map_pin')||'',ACT=Date.now();const AUTH=()=>A+':'+PIN;
let T=(location.hash.slice(1)||'aide'),D=null,pc=null,cur=null,vu=0,dc=null,ctrlOn=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=x=>x?new Date(x).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const crd=c=>c?c.slice(0,4)+' '+c.slice(4,8)+' '+c.slice(8):'';
async function charger(){if(!A||!PIN||cur)return;const r=await rpc('skyeco_admin',{p_admin:AUTH()});if(r.erreur){verrouiller();return}D=r;
 const n=(D.aide||[]).length;$('badge').innerHTML=n?`<span class="dot"></span>${n} demande(s) d'aide en direct`:'';if(n>vu&&vu>=0)try{new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play()}catch(e){}vu=n;document.title=(n?'('+n+') ':'')+'Administration Skyeco';vue()}
function verrouiller(){PIN='';sessionStorage.removeItem('map_pin');D=null;if(pc){try{pc.close()}catch(e){}pc=null;cur=null}vue()}
async function entrer(){const c=$('pin').value;const r=await rpc('skyeco_admin_entrer',{p_cle:A,p_code:c});
 if(r.ok){PIN=c;sessionStorage.setItem('map_pin',c);ACT=Date.now();D=null;vue();charger()}else{$('perr').textContent=r.erreur||r.message||'Erreur, réessayez';if(r.erreur==='Clé inconnue'){A='';localStorage.removeItem('map_admin');setTimeout(vue,1200)}}}
async function ecranCode(){const e=await rpc('skyeco_admin_etat',{p_cle:A});if(!e.cle){A='';localStorage.removeItem('map_admin');return vue()}
 $('app').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><div style="font-size:40px">🔒</div><b style="font-size:18px">${e.code_existe?"Code d'ouverture":"Créez votre code d'ouverture"}</b><p class="hint">${e.code_existe?"Tapez votre code pour ouvrir l'administration.":"Au moins 6 caractères. Il vous sera demandé à chaque ouverture. Ne le donnez à personne."}</p>
 <div style="position:relative"><input id="pin" type="password" autocomplete="${e.code_existe?'current-password':'new-password'}" style="width:100%;text-align:center;font-size:20px;padding-right:52px" onkeydown="if(event.key==='Enter')entrer()"><button type="button" id="oeil" aria-label="Afficher le code" title="Afficher / masquer" onclick="const i=$('pin'),v=i.type==='password';i.type=v?'text':'password';this.textContent=v?'🙈':'👁️';i.focus()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;cursor:pointer;padding:6px">👁️</button></div><div id="perr" style="color:#B91C1C;margin:8px 0;min-height:18px"></div><button class="btn d" style="width:100%" onclick="entrer()">${e.code_existe?'Ouvrir':'Créer mon code'}</button></div>`;setTimeout(()=>$('pin')&&$('pin').focus(),50)}
function vue(){
 $('lock').style.display=A&&PIN?'':'none';
 if(A&&!PIN){ecranCode();return}
 if(!A){$('app').innerHTML=`<div class="card"><b>Clé administrateur</b><p class="hint">Collez votre clé (une seule fois sur cet appareil).</p><input id="k"> <button class="btn" onclick="A=$('k').value.trim();localStorage.setItem('map_admin',A);charger()">Entrer</button></div>`;return}
 if(cur)return;if(!D){$('app').innerHTML='<div class="card hint">Chargement…</div>';return}
 const tabs=[['aide','🆘 Aide en direct ('+D.aide.length+')'],['rdv','📅 Rendez-vous et rappels ('+(D.rappels.length+D.rdv.length)+')'],['applis','🧰 Applis et clients']];
 let h=`<div class="tabs">${tabs.map(([k,l])=>`<button class="${T===k?'on':''}" onclick="location.hash='${k}'">${l}</button>`).join('')}</div>`;
 if(T==='aide'){h+=`<div class="card hint">Les clients demandent de l'aide depuis l'appli (bouton « 🆘 Besoin d'aide »). <b>Voir l'écran</b> : rien à installer, vous voyez en direct et pouvez cocher « Prise de contrôle » pour cliquer/écrire à leur place DANS l'application. <b>Prendre la main</b> : pour agir hors de l'application (tout l'ordinateur), ils vous donnent un code Chrome Bureau à distance, avec un petit logiciel à installer une seule fois.</div>`+
  (D.aide.map(a=>a.type==='controle'?`<div class="card"><div class="row"><div><b>🖱️ ${esc(a.nom)}</b> <span class="pill">${esc(a.app||'')}</span><div class="hint">${fd(a.quand)}${a.tel?' · <a href="tel:'+esc(a.tel)+'">'+esc(a.tel)+'</a>':''} · le code expire 5 min après sa création</div></div><button class="btn l" onclick="finir('${a.id}')">Terminé</button></div>
   <p style="margin:12px 0 6px">Code d'accès :</p><span class="code">${crd(a.code_crd)}</span> <button class="btn l" onclick="navigator.clipboard.writeText('${a.code_crd}');this.textContent='✓ Copié'">Copier</button>
   <p><a class="btn d" href="https://remotedesktop.google.com/support/" target="_blank" rel="noopener">🖱️ Prendre la main</a></p><div class="hint">Sur la page qui s'ouvre, rubrique « Donner de l'aide », collez le code puis « Se connecter ». Le client doit cliquer « Partager » de son côté.</div></div>`
   :`<div class="card row"><div><b>🖥️ ${esc(a.nom)}</b> <span class="pill">${esc(a.app||'')}</span><div class="hint">Partage d'écran (lecture seule) · code ${esc(a.code)} · ${fd(a.quand)}${a.statut==='vu'?' · déjà ouvert':''}</div></div><div style="display:flex;gap:8px"><button class="btn d" ${a.offre?'':'disabled'} onclick="voir('${a.id}')">👀 Voir son écran</button><button class="btn l" onclick="finir('${a.id}')">Terminé</button></div></div>`).join('')||'<div class="card hint">Aucune demande d\'aide en ce moment. Cette page se met à jour toute seule et le titre de l\'onglet affiche le nombre de demandes.</div>')}
 if(T==='rdv'){h+=`<div class="card"><b>📅 Rendez-vous à venir</b>${D.rdv.map(r=>`<div style="padding:8px 0;border-bottom:1px solid #EEF1F4"><b>${fd(r.quand)}</b> · ${esc(r.nom)} ${r.tel?'· <a href="tel:'+esc(r.tel)+'">'+esc(r.tel)+'</a>':''} <span class="pill">${esc(r.type||'rendez-vous')}</span><div class="hint">${esc(r.msg||'')}</div></div>`).join('')||'<div class="hint">Aucun.</div>'}</div>
  <div class="card"><b>📞 Demandes de rappel et d'installation (60 jours)</b>${D.rappels.map(r=>`<div style="padding:8px 0;border-bottom:1px solid #EEF1F4"><div class="row"><span><b>${esc(r.nom)}</b> ${r.tel?'· <a href="tel:'+esc(r.tel)+'">'+esc(r.tel)+'</a>':''} <span class="pill">${esc(r.app)}</span></span><span class="hint">${fd(r.quand)}</span></div><div class="hint">${esc(r.quoi||'')}${r.msg?' · '+esc(r.msg):''}${r.statut?' · '+esc(r.statut):''}</div></div>`).join('')||'<div class="hint">Aucune.</div>'}</div>`}
 if(T==='applis'){const L=[['Mon Assistant Pro','/mon-assistant-pro/','Page de présentation'],['Mon Assistant Pro – inscription / appli','/mon-assistant-pro/inscription/','L\'appli des clients'],['Contact Chantier','/contact-chantier/','Appli de suivi de chantier'],['Accueil Skyeco','/','skyeco.fr']];
  h+=`<div class="card"><b>🧰 Vos applis</b>${L.map(l=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #EEF1F4"><span><b>${l[0]}</b><div class="hint">${l[2]}</div></span><a class="btn l" href="${l[1]}" target="_blank">Ouvrir</a></div>`).join('')}</div>
  <div class="card"><b>👥 Comptes Mon Assistant Pro</b>${D.comptes.map(c=>`<div style="padding:8px 0;border-bottom:1px solid #EEF1F4"><b>${esc(c.nom)}</b><div class="hint">SIRET ${esc(c.siret)} · créé ${fd(c.cree)}</div></div>`).join('')}</div>`}
 $('app').innerHTML=h}
async function finir(id){await rpc('skyeco_aide_fin',{p_admin:AUTH(),p_id:id});charger()}
function dcEnvoyer(o){if(dc&&dc.readyState==='open')dc.send(JSON.stringify(o))}
function ctrlBasc(c){ctrlOn=c.checked;const v=$('v');if(v)v.style.cursor=ctrlOn?'crosshair':'default'}
function ctrlTexte(){const i=$('txtEnv');if(!i||!i.value)return;dcEnvoyer({t:'texte',v:i.value});i.value=''}
function ctrlTouche(k){dcEnvoyer({t:'touche',k})}
async function voir(id){const l=await rpc('map_ecran_liste',{p_admin:AUTH()});const s=l.find(x=>x.id===id);if(!s||!s.offre)return alert("Le partage n'est plus disponible.");cur=s;dc=null;ctrlOn=false;history.pushState(null,'','#ecran');
 $('app').innerHTML=`<div class="card row"><div><b>Écran de ${esc(s.nom)}</b><div class="hint" id="st">Connexion…</div></div><button class="btn" onclick="arreter()">Terminer</button></div>
 <video id="v" autoplay playsinline muted></video>
 <div class="card"><label><input type="checkbox" id="ctrlChk" onchange="ctrlBasc(this)"> 🖱️ Activer la prise de contrôle dans l'application (un clic sur l'écran ci-dessus cliquera chez l'artisan)</label>
 <div id="ctrlSt" class="hint" style="margin-top:4px">Le canal de contrôle n'est pas encore prêt — ça arrive quelques secondes après la connexion.</div>
 <div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><input id="txtEnv" placeholder="Texte à écrire dans le champ actif de l'artisan" style="flex:1;min-width:220px">
 <button class="btn l" onclick="ctrlTexte()">Écrire</button><button class="btn l" onclick="ctrlTouche('Entree')">⏎ Entrée</button><button class="btn l" onclick="ctrlTouche('Effacer')">⌫ Effacer</button><button class="btn l" onclick="ctrlTouche('Tab')">↹ Tab suivant</button></div></div>`;
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
 pc.ontrack=e=>{$('v').srcObject=e.streams[0];$('st').textContent='En direct'};
 pc.ondatachannel=e=>{dc=e.channel;dc.onopen=()=>{const t=$('ctrlSt');if(t)t.textContent="Prêt : cochez la case ci-dessus pour cliquer, écrire ou appuyer sur une touche à la place de l'artisan, dans l'application."}};
 pc.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.connectionState))$('st').textContent='Connexion perdue. Demandez au client de relancer le partage.'};
 await pc.setRemoteDescription({type:'offer',sdp:s.offre});await pc.setLocalDescription(await pc.createAnswer());
 await new Promise(r=>{if(pc.iceGatheringState==='complete')return r();pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')r()};setTimeout(r,4000)});
 await rpc('map_ecran_repondre',{p_admin:AUTH(),p_id:id,p_sdp:pc.localDescription.sdp});
 $('v').addEventListener('click',e=>{if(!ctrlOn)return;const r=e.target.getBoundingClientRect();dcEnvoyer({t:'clic',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})});
 $('v').addEventListener('wheel',e=>{if(!ctrlOn)return;e.preventDefault();dcEnvoyer({t:'defiler',dy:e.deltaY})},{passive:false})}
async function arreter(){const c=cur;cur=null;dc=null;ctrlOn=false;if(c)await rpc('map_ecran_admin_fin',{p_admin:AUTH(),p_id:c.id});if(pc)pc.close();pc=null;if(location.hash==='#ecran')history.replaceState(null,'','#aide');T='aide';charger()}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1)||'aide';if(cur&&t!=='ecran'){arreter();}T=['aide','rdv','applis'].includes(t)?t:'aide';vue()});
['click','keydown','mousemove','touchstart'].forEach(ev=>addEventListener(ev,()=>ACT=Date.now(),{passive:true}));
setInterval(()=>{if(PIN&&!cur&&Date.now()-ACT>30*60*1000)verrouiller()},30000);
vue();charger();setInterval(charger,5000);
</script></body></html>
