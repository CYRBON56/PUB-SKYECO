<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Contacts gratuits – Skyeco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14304A;--orange:#E8622C;--bg:#F4F7F9;--surface:#fff;--ink:#14304A;--text:#27394A;--muted:#5B6268;--line:#D5DEE5;--ok:#2E7D5B;--ok-soft:#DDF0E6;--alert:#C0392B;--alert-soft:#F8E0DD;--warn-soft:#FBE3D8;--focus:#2F6FEB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1B28;--surface:#15263A;--ink:#EEF3F7;--text:#D4DEE7;--muted:#9FB0BF;--line:#2A3E53;--ok:#5DBB8E;--ok-soft:#173327;--alert:#E57B6E;--alert-soft:#3A1E1B;--warn-soft:#3A2418;--focus:#86B4FF}}
:root[data-theme="dark"]{--bg:#0E1B28;--surface:#15263A;--ink:#EEF3F7;--text:#D4DEE7;--muted:#9FB0BF;--line:#2A3E53;--ok:#5DBB8E;--ok-soft:#173327;--alert:#E57B6E;--alert-soft:#3A1E1B;--warn-soft:#3A2418;--focus:#86B4FF}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:var(--navy);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.logo svg{width:36px;height:36px}
.word{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;font-size:1.6rem;color:#fff}.word b{color:var(--orange)}
.sub{color:#AFC3D4;font-size:.85rem}
h1,h2{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;color:var(--ink);margin:0;line-height:1}
h2{font-size:1.55rem;font-weight:800;margin-bottom:12px}
main{padding:24px 0 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:8px 13px}
button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-o{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.maj{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:.82rem}
.kpi strong{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:2.1rem;font-weight:900;color:var(--ink);line-height:1.1}
.kpi.bon{background:var(--ok-soft);border-color:transparent}.kpi.mal{background:var(--alert-soft);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.funnel .step{display:grid;grid-template-columns:170px minmax(0,1fr) 70px;gap:10px;align-items:center;margin-bottom:9px;font-size:.92rem}
.track{height:22px;background:var(--bg);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--navy);border-radius:4px;min-width:2px}
.fill.o{background:var(--orange)}
.rate{color:var(--muted);font-size:.82rem;text-align:right}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.8rem}
td.n,th.n{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.78rem;font-weight:600}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-bad{background:var(--alert-soft);color:var(--alert)}.p-na{background:var(--bg);color:var(--muted)}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:.88rem;margin-bottom:6px}
.hbar .track{height:14px}
.audit{white-space:pre-line}
.login{max-width:380px;margin:60px auto}
input{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:10px 0}
.err{color:var(--alert);font-size:.9rem;min-height:1.3em}
.hidden{display:none!important}
@media (max-width:820px){.cols{grid-template-columns:1fr}.funnel .step{grid-template-columns:120px minmax(0,1fr) 60px}.hbar{grid-template-columns:110px minmax(0,1fr) 36px}}
</style>
<style>
.lead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.lead-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.lead-h strong{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:1.45rem;color:var(--ink)}
.resume{background:var(--bg);border-radius:8px;padding:10px 12px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.coord{font-size:.92rem;margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:7px 9px}
textarea{width:100%;min-height:56px;margin-top:8px}
.ent{border-top:1px solid var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem}
.ent a{color:inherit}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/prix-travaux.html"><svg viewBox="0 0 140 140" aria-hidden="true"><rect width="140" height="140" rx="28" fill="#1C3F5F"/><g transform="rotate(-6 62 70)"><rect x="30" y="24" width="64" height="86" rx="6" fill="#F4F7F9"/><rect x="40" y="38" width="34" height="5" rx="2" fill="#14304A" opacity=".55"/><rect x="40" y="50" width="44" height="5" rx="2" fill="#14304A" opacity=".35"/><rect x="40" y="62" width="28" height="5" rx="2" fill="#14304A" opacity=".35"/><rect x="40" y="90" width="44" height="2" fill="#14304A" opacity=".25"/></g><circle cx="96" cy="92" r="30" fill="#E8622C"/><text x="96" y="104" text-anchor="middle" font-family="Big Shoulders Display, Arial, sans-serif" font-weight="900" font-size="34" fill="#F4F7F9">€</text><path d="M22 46 40 30v8h16v8H40v8Z" fill="#E8622C"/></svg><span><span class="word">SKY<b>ECO</b></span><br><span class="sub">Contacts gratuits à proposer aux entreprises</span></span></a><span style="display:flex;gap:14px"><a class="sub" href="/artisans-chantiers.html" style="color:#fff">Artisans inscrits</a><a class="sub" href="/stats-prix-travaux.html" style="color:#fff">Tableau de bord</a></span></div></header>
<main><div class="wrap">
<section id="login" class="card login">
  <h2>Accès réservé</h2>
  <label for="mdp">Mot de passe interne</label>
  <input type="password" id="mdp" autocomplete="current-password">
  <p class="err" id="err"></p>
  <button class="btn-o" id="go">Ouvrir</button>
</section>
<div id="dash" class="hidden">
  <div class="bar"><div class="seg" id="filtres"><button data-f="tous" aria-pressed="true">Tous</button><button data-f="nouveau">Nouveaux</button><button data-f="propose">Proposés</button><button data-f="vendu">Vendus</button><button data-f="sans_suite">Sans suite</button></div><span class="maj" id="maj"></span></div>
  <div class="grid" id="kpis"></div>
  <div id="liste"></div>
</div>
</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=v=>(Math.round((+v||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const STATUTS={nouveau:"Nouveau",propose:"Proposé",vendu:"Vendu",sans_suite:"Sans suite",retrait:"Accord retiré"};
let mdp="",contacts=[],metiers={},filtre="tous";
try{mdp=sessionStorage.getItem("skyeco_stats")||""}catch(e){}
async function api(action,extra){
  const r=await fetch("/api/contacts-prix-travaux",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({motDePasseInterne:mdp,action,...extra})});
  const d=await r.json();
  if(r.status===401){try{sessionStorage.removeItem("skyeco_stats")}catch(e){} $("dash").classList.add("hidden");$("login").classList.remove("hidden");$("err").textContent="Mot de passe incorrect.";throw new Error("auth")}
  if(!r.ok) throw new Error(d.error||"Erreur"); return d;
}
function resume(c){
  const q=c.reponses?.qty, u={toiture:"m² au sol",ravalement:"m² au sol",menuiseries:"menuiserie(s)",anc:"chambre(s)",pac:"m² habitables",electricite:"m² habitables",plomberie:"m² habitables",clotures:"m",cuisine:"m de meubles",portails:"m de passage"}[c.metier]||"m²";
  return `Projet ${(metiers[c.metier]||c.metier).toLowerCase()}, ${q} ${u}, code postal ${c.code_postal}${c.estimation_ttc?`, budget estimé environ ${Number(c.estimation_ttc).toLocaleString("fr-FR")} € TTC`:""}. Téléphone vérifié par SMS.`;
}
async function charger(){
  try{ const d=await api("liste"); contacts=d.contacts; metiers=d.metiers;
    try{sessionStorage.setItem("skyeco_stats",mdp)}catch(e){}
    $("login").classList.add("hidden"); $("dash").classList.remove("hidden"); afficher();
    $("maj").textContent="Mis à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+", actualisation automatique toutes les 5 minutes.";
  }catch(e){ if(e.message!=="auth") $("maj").textContent="Chargement impossible : "+e.message }
}
function afficher(){
  const ventes=contacts.flatMap(c=>c.ventes||[]);
  $("kpis").innerHTML=[["Contacts reçus",contacts.length],["À traiter",contacts.filter(c=>c.statut==="nouveau").length],["Ventes réalisées",ventes.length],["Chiffre d'affaires",eur(ventes.reduce((a,v)=>a+(+v.prix||0),0))]].map(([l,v])=>`<div class="kpi"><small>${l}</small><strong>${v}</strong></div>`).join("");
  const liste=contacts.filter(c=>filtre==="tous"||c.statut===filtre);
  $("liste").innerHTML=liste.length?liste.map(c=>{const v=c.ventes||[];return `<article class="lead" data-id="${c.id}">
    <div class="lead-h"><strong>${esc(metiers[c.metier]||c.metier)} · ${esc(c.code_postal)}</strong><span class="maj">${new Date(c.created_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})} · <span class="pill ${c.statut==="vendu"?"p-ok":c.statut==="nouveau"?"p-bad":"p-na"}">${STATUTS[c.statut]||c.statut}</span> · vendu ${v.length}/3</span></div>
    <div class="resume"><span>${esc(resume(c))}</span><button data-copie>Copier le résumé anonyme</button></div>
    <p class="coord"><strong>${esc(c.prenom)} ${esc(c.nom)}</strong> · <a href="tel:${esc(c.telephone)}">${esc(c.telephone)}</a> · <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p>
    <p class="maj" style="margin:0">Ne transmettez ces coordonnées qu'à une entreprise qui a accepté et payé.</p>
    ${v.length?`<p class="coord">Vendu à : ${v.map(x=>`${esc(x.entreprise)} (${eur(x.prix)}, ${new Date(x.date).toLocaleDateString("fr-FR")})`).join(" · ")}</p>`:""}
    <div class="actions"><button class="btn-o" data-ent>Entreprises proches</button><button data-notif>Alerter les artisans inscrits</button>
      <select data-statut aria-label="Statut">${Object.entries(STATUTS).map(([k,l])=>`<option value="${k}" ${k===c.statut?"selected":""}>${l}</option>`).join("")}</select></div>
    <textarea data-note placeholder="Note (qui a été appelé, réponse…)">${esc(c.note||"")}</textarea>
    <div data-zone-ent></div></article>`}).join(""):`<p class="maj">Aucun contact pour ce filtre.</p>`;
}
$("liste").addEventListener("click",async e=>{
  const card=e.target.closest(".lead"); if(!card) return; const id=card.dataset.id, c=contacts.find(x=>x.id===id);
  if(e.target.matches("[data-notif]")){ try{ const d=await api("notifier",{id}); e.target.textContent=d.notifies?`${d.notifies} artisan(s) alerté(s)`:"Aucun artisan inscrit et validé pour ce métier et ce département" }catch(er){ alert(er.message) } }
  if(e.target.matches("[data-copie]")){ try{await navigator.clipboard.writeText(resume(c)); e.target.textContent="Copié"}catch(er){ prompt("Copiez le résumé :",resume(c)) } }
  if(e.target.matches("[data-ent]")){
    const z=card.querySelector("[data-zone-ent]"); z.innerHTML='<p class="maj">Recherche…</p>';
    try{ const d=await api("entreprises",{id});
      z.innerHTML=d.entreprises.length?`<p class="maj" style="margin-top:10px">${d.entreprises.length} entreprise(s) du département ${esc(c.departement)} (codes d'activité ${esc(d.codes.join(", "))}) :</p>`+d.entreprises.map(x=>`<div class="ent"><span><strong>${esc(x.nom_entreprise)}</strong> · ${esc(x.ville||"")}${x.telephone?` · <a href="tel:${esc(x.telephone)}">${esc(x.telephone)}</a>`:""}${x.email?` · <a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:""}</span><button data-vendre data-nom="${esc(x.nom_entreprise)}" data-siret="${esc(x.siret||"")}">Vendu à cette entreprise</button></div>`).join("")
        :`<p class="maj" style="margin-top:10px">Aucune entreprise correspondante dans votre base pour ce département. <button data-vendre data-nom="" data-siret="">Saisir une vente manuellement</button></p>`;
    }catch(er){ z.innerHTML=`<p class="err">${esc(er.message)}</p>` }
  }
  if(e.target.matches("[data-vendre]")){
    const nom=e.target.dataset.nom||prompt("Nom de l'entreprise :"); if(!nom) return;
    const prix=prompt(`Prix de vente du contact à ${nom}, en euros HT :`); if(prix===null) return;
    try{ const d=await api("vendre",{id,entreprise:nom,siret:e.target.dataset.siret,prix:parseFloat(String(prix).replace(",","."))}); Object.assign(c,d.contact); afficher() }catch(er){ alert(er.message) }
  }
});
$("liste").addEventListener("change",async e=>{
  const card=e.target.closest(".lead"); if(!card||!e.target.matches("[data-statut]")) return; const id=card.dataset.id, c=contacts.find(x=>x.id===id);
  try{ const d=await api("statut",{id,statut:e.target.value,note:card.querySelector("[data-note]").value}); Object.assign(c,d.contact); afficher() }catch(er){ alert(er.message) }
});
$("liste").addEventListener("focusout",async e=>{
  if(!e.target.matches("[data-note]")) return; const card=e.target.closest(".lead"), c=contacts.find(x=>x.id===card.dataset.id);
  if(e.target.value===(c.note||"")) return;
  try{ const d=await api("statut",{id:c.id,statut:c.statut,note:e.target.value}); Object.assign(c,d.contact) }catch(er){ alert(er.message) }
});
document.querySelectorAll("#filtres button").forEach(b=>b.onclick=()=>{filtre=b.dataset.f;document.querySelectorAll("#filtres button").forEach(x=>x.setAttribute("aria-pressed",x===b));afficher()});
$("go").onclick=()=>{mdp=$("mdp").value;$("err").textContent="";charger()};
$("mdp").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
setInterval(()=>{if(mdp&&!document.hidden&&!document.activeElement?.matches?.("textarea"))charger()},300000);
if(mdp) charger();
</script>
</body>
</html>
