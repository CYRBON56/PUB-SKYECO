<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Skyeco Pro</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#f5f8f6; color:#14312a; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card { background:#fff; border-radius:18px; padding:36px 32px; max-width:420px; width:100%; box-shadow:0 8px 30px rgba(20,49,42,0.08); }
  h1 { font-size:1.3rem; margin-bottom:6px; }
  .sub { color:#5b6b64; font-size:0.88rem; margin-bottom:24px; line-height:1.5; }
  label { display:block; font-size:0.82rem; font-weight:700; margin-bottom:6px; margin-top:14px; }
  input {
    width:100%; padding:11px 14px; border:1.5px solid #d7dedb; border-radius:10px; font-size:0.95rem;
    font-family:inherit; color:#14312a;
  }
  input:focus { outline:none; border-color:#1e6f4c; }
  .btn-principal {
    width:100%; background:#1e6f4c; color:#fff; border:none; border-radius:10px; padding:13px;
    font-size:0.92rem; font-weight:700; cursor:pointer; margin-top:22px;
  }
  .btn-principal:hover { filter:brightness(1.05); }
  .btn-principal:disabled { opacity:0.5; cursor:wait; }
  .msg { font-size:0.85rem; padding:10px 14px; border-radius:10px; margin-top:16px; line-height:1.5; }
  .msg.err { background:#fdeaea; color:#991b1b; }
  .msg.ok { background:#eaf4ef; color:#1e6f4c; }
  .loading { text-align:center; padding:20px 0; color:#5b6b64; }
</style>
</head>
<body>
<div class="card" id="carte">
  <h1>Choisissez un nouveau mot de passe</h1>
  <p class="sub">Ce lien est valable 1 heure.</p>
  <form id="formReset">
    <label>Nouveau mot de passe</label>
    <input type="password" id="mdp1" minlength="8" required placeholder="8 caractères minimum">
    <label>Confirmez le mot de passe</label>
    <input type="password" id="mdp2" minlength="8" required>
    <button class="btn-principal" type="submit">Enregistrer</button>
  </form>
  <div id="zoneMsg"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const draftId = params.get('id');
  const token = params.get('token');

  if (!draftId || !token) {
    document.getElementById('carte').innerHTML = '<div class="loading">Lien invalide ou incomplet.</div>';
  } else {
    document.getElementById('formReset').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mdp1 = document.getElementById('mdp1').value;
      const mdp2 = document.getElementById('mdp2').value;
      const zoneMsg = document.getElementById('zoneMsg');
      const btn = e.target.querySelector('button');

      if (mdp1 !== mdp2) {
        zoneMsg.innerHTML = '<div class="msg err">Les deux mots de passe ne correspondent pas.</div>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Enregistrement…';
      try {
        const res = await fetch('/api/dashboard-reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ draftId, token, nouveauMotDePasse: mdp1 })
        });
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('skyeco_dashboard_token_' + draftId, data.token);
          zoneMsg.innerHTML = '<div class="msg ok">✓ Mot de passe mis à jour, redirection…</div>';
          setTimeout(() => { window.location.href = '/mon-dashboard.html?id=' + draftId; }, 1000);
        } else {
          zoneMsg.innerHTML = `<div class="msg err">${data.error || 'Une erreur est survenue.'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Enregistrer';
        }
      } catch (e) {
        zoneMsg.innerHTML = '<div class="msg err">Impossible de contacter le serveur.</div>';
        btn.disabled = false;
        btn.textContent = 'Enregistrer';
      }
    });
  }
</script>
<!-- SKYECO_COOKIE_BANNER_START -->
<div id="skyeco-cookies" style="position:fixed; left:0; right:0; bottom:0; z-index:99999; background:#14202B; color:#F4F7F9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; box-shadow:0 -6px 24px rgba(0,0,0,0.25); display:none;">
  <div style="max-width:1000px; margin:0 auto; padding:18px 20px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
    <p style="flex:1; min-width:240px; margin:0; font-size:13.5px; line-height:1.5; color:#C9D6DF;">
      Nous utilisons des cookies n&#233;cessaires au fonctionnement du site et, avec votre accord, des cookies de mesure d&#8217;audience et de suivi publicitaire (Google Ads) pour am&#233;liorer nos services.
      <a href="/politique-confidentialite.html" style="color:#E8622C; text-decoration:underline;">En savoir plus</a>
    </p>
    <div style="display:flex; gap:10px; flex-shrink:0; flex-wrap:wrap;">
      <button type="button" onclick="skyecoCookiesChoix('essentiel')" style="background:transparent; border:1px solid rgba(255,255,255,0.35); color:#F4F7F9; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; border-radius:4px;">Essentiels uniquement</button>
      <button type="button" onclick="skyecoCookiesChoix('tous')" style="background:#E8622C; border:1px solid #E8622C; color:#fff; padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; border-radius:4px;">Tout accepter</button>
    </div>
  </div>
</div>
<button type="button" id="skyeco-cookies-lien" onclick="skyecoCookiesOuvrir()" aria-label="G&#233;rer mes cookies" style="display:none; position:fixed; left:16px; bottom:16px; z-index:99998; background:#14202B; color:#F4F7F9; border:1px solid rgba(255,255,255,0.25); border-radius:20px; padding:8px 14px; font-size:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; cursor:pointer;">&#x1F36A; Cookies</button>
<script>
(function(){
  var CLE = 'skyeco_cookie_consent';
  function lireChoix(){ try { return JSON.parse(localStorage.getItem(CLE) || 'null'); } catch(e){ return null; } }
  function appliquerChoix(choix){
    // Point d'extension : charger ici Google Ads / Analytics uniquement si choix.niveau === 'tous'.
    // Rien n'est charge pour l'instant.
    window.skyecoConsentement = choix;
  }
  window.skyecoCookiesChoix = function(niveau){
    var choix = { niveau: niveau, date: new Date().toISOString() };
    try { localStorage.setItem(CLE, JSON.stringify(choix)); } catch(e){}
    var b = document.getElementById('skyeco-cookies'); if(b) b.style.display = 'none';
    var l = document.getElementById('skyeco-cookies-lien'); if(l) l.style.display = 'block';
    appliquerChoix(choix);
  };
  window.skyecoCookiesOuvrir = function(){
    var b = document.getElementById('skyeco-cookies'); if(b) b.style.display = 'block';
    var l = document.getElementById('skyeco-cookies-lien'); if(l) l.style.display = 'none';
  };
  document.addEventListener('DOMContentLoaded', function(){
    var choix = lireChoix();
    var b = document.getElementById('skyeco-cookies');
    var l = document.getElementById('skyeco-cookies-lien');
    if(choix && choix.niveau){
      if(l) l.style.display = 'block';
      appliquerChoix(choix);
    } else if(b){
      b.style.display = 'block';
    }
  });
})();
</script>
<!-- SKYECO_COOKIE_BANNER_END -->
</body>
</html>
