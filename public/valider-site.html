<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valider un site — Skyeco Pro</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f4ece2; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color:#14312a; padding:24px; }
  .card { max-width:420px; width:100%; background:#fff; border-radius:16px; padding:32px 28px; box-shadow:0 10px 30px rgba(0,0,0,0.08); text-align:center; }
  h1 { font-size:1.3rem; margin:0 0 10px; }
  p { color:#5b6b64; line-height:1.55; margin:0 0 22px; }
  button { width:100%; background:#1e6f4c; color:#fff; border:none; border-radius:10px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:0.6; cursor:wait; }
  .ok { color:#1e6f4c; font-weight:700; }
  .err { color:#c0392b; font-weight:700; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div>Chargement…</div>
  </div>

<script>
  // Sécurité (06/09/2026) : cette page lisait/écrivait auparavant
  // skyeco_pro_vitrine_drafts directement avec la clé anonyme Supabase —
  // remplacé par api/valider-site.js, qui vérifie le jeton côté serveur
  // avant toute lecture/écriture (voir ce fichier pour le détail).
  const params = new URLSearchParams(window.location.search);
  const draftId = params.get('id');
  const token = params.get('token');
  const card = document.getElementById('card');

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  async function appelerValidation(confirmer) {
    const resp = await fetch('/api/valider-site', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ draftId, token, confirmer }),
    });
    return resp.json();
  }

  async function init() {
    if (!draftId || !token) {
      card.innerHTML = '<h1>Lien invalide</h1><p>Il manque des informations dans ce lien.</p>';
      return;
    }
    try {
      const data = await appelerValidation(false);
      if (!data.success) {
        if (data.error === 'lien_expire') {
          card.innerHTML = '<h1>Lien expiré</h1><p>Une nouvelle demande de validation a peut-être été envoyée depuis — vérifiez votre dernier SMS.</p>';
        } else {
          card.innerHTML = '<h1>Introuvable</h1><p>Ce site n\'existe plus.</p>';
        }
        return;
      }
      const nomEntreprise = escapeHtml(data.entreprise || 'Ce site');
      if (data.dejaValide) {
        card.innerHTML = `<h1>${nomEntreprise}</h1><p class="ok">✓ Déjà validé.</p>`;
        return;
      }
      card.innerHTML = `
        <h1>${nomEntreprise}</h1>
        <p>Confirmer que ce site est prêt à être mis en ligne (l'artisan pourra alors payer ou démarrer son essai gratuit).</p>
        <button id="btnValider">✓ Confirmer la validation</button>
      `;
      document.getElementById('btnValider').addEventListener('click', async () => {
        const btn = document.getElementById('btnValider');
        btn.disabled = true;
        btn.textContent = '…';
        try {
          const dataConfirm = await appelerValidation(true);
          if (!dataConfirm.success) throw new Error();
          card.innerHTML = `<h1>${nomEntreprise}</h1><p class="ok">✓ Site validé — l'artisan peut maintenant payer ou démarrer son essai gratuit.</p>`;
        } catch (e) {
          btn.disabled = false;
          btn.textContent = '✓ Confirmer la validation';
          alert('Impossible de valider pour le moment.');
        }
      });
    } catch (e) {
      card.innerHTML = '<h1>Erreur</h1><p class="err">Impossible de charger cette page pour le moment.</p>';
    }
  }
  init();
</script>
</body>
</html>
