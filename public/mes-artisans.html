<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes artisans — Skyeco Pro Admin</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#f2f4f1; color:#14312a; padding:36px 28px 60px;
  }
  .wrap { max-width:1180px; margin:0 auto; }

  .top-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
  h1 { font-size:1.6rem; font-weight:800; letter-spacing:-0.01em; }
  .sub { font-size:0.9rem; color:#6b7a72; margin-top:4px; }

  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:28px; }
  .stat-card {
    background:#fff; border-radius:16px; padding:18px 20px;
    box-shadow:0 1px 2px rgba(20,49,42,0.04), 0 6px 20px rgba(20,49,42,0.05);
  }
  .stat-card .valeur { font-size:1.7rem; font-weight:800; line-height:1; }
  .stat-card .label { font-size:0.76rem; color:#8a9891; margin-top:6px; font-weight:600; }
  .stat-card.accent-vert .valeur { color:#1e6f4c; }
  .stat-card.accent-orange .valeur { color:#e8622c; }

  .filtre-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .filtre-row input {
    padding:11px 16px; border:1.5px solid #e0e5df; border-radius:12px; font-size:0.88rem; flex:1; min-width:220px;
    background:#fff; transition:border-color 0.15s;
  }
  .filtre-row input:focus { outline:none; border-color:#1e6f4c; }

  .table-card { background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 1px 2px rgba(20,49,42,0.04), 0 6px 24px rgba(20,49,42,0.06); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:14px 18px; background:#fafaf7; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; color:#8a9891; font-weight:700; border-bottom:1px solid #eef1ec; }
  td { padding:14px 18px; border-top:1px solid #f2f4f0; font-size:0.87rem; vertical-align:middle; }
  tr:hover td { background:#fbfcfa; }

  .entreprise-cell { display:flex; align-items:center; gap:12px; }
  .avatar-initiale {
    width:36px; height:36px; border-radius:10px; background:#eaf4ef; color:#1e6f4c;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.9rem; flex-shrink:0;
  }
  .entreprise-nom { font-weight:700; }
  .entreprise-metier { font-size:0.76rem; color:#8a9891; margin-top:1px; }

  .badge { font-size:0.7rem; font-weight:700; padding:4px 11px; border-radius:999px; display:inline-block; }
  .badge-preview { background:#f0f1ec; color:#6b7a72; }
  .badge-published { background:#eaf4ef; color:#1e6f4c; }
  .badge-desactive { background:#fdeceb; color:#c0392b; }

  .date-cell { color:#8a9891; font-size:0.82rem; }

  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn-action {
    font-size:0.76rem; font-weight:700; padding:8px 13px; border-radius:9px; border:1.5px solid transparent;
    cursor:pointer; text-decoration:none; display:inline-block; white-space:nowrap; transition:all 0.15s;
  }
  .btn-copier { background:#f2f4f1; color:#14312a; }
  .btn-copier:hover { background:#e5e9e3; }
  .btn-envoyer { background:#e8622c; color:#fff; }
  .btn-envoyer:hover { filter:brightness(1.06); }
  .btn-envoyer:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-voir { background:#fff; border-color:#d7e3dc; color:#1e6f4c; }
  .btn-voir:hover { border-color:#1e6f4c; }
  .btn-valide-off { background:#fff; border-color:#e0e5df; color:#8a9891; }
  .btn-valide-off:hover { border-color:#1e6f4c; color:#1e6f4c; }
  .btn-valide-on { background:#eaf4ef; border-color:#1e6f4c; color:#1e6f4c; }
  .btn-dashboard { background:#fff; border-color:#e0e5df; color:#14312a; }
  .btn-elements-admin, .btn-campagne-admin { background:#fff; border-color:#e0e5df; color:#14312a; text-decoration:none; }
  /* 03/09 : accès direct à la section "zone/km" d'un artisan (même principe que
     le bouton Dashboard) + lien rapide vers Google Ads pour reporter le
     changement manuellement. */
  .btn-zone { background:#fff; border-color:#e0e5df; color:#14312a; }
  .btn-zone:hover { border-color:#14312a; }
  .btn-google-ads { background:#fff; border-color:#e0e5df; color:#14312a; text-decoration:none; }
  .btn-google-ads:hover { border-color:#4285F4; }
  .btn-google-ads svg { vertical-align:-2px; margin-right:3px; }
  .badge-compteur-demandes { margin-left:8px; font-size:0.78rem; color:#5b6b64; }
  .btn-onglet-vue { background:#fff; border:1.5px solid #e0e5df; color:#5b6b64; border-radius:8px; padding:9px 16px; font-size:0.85rem; font-weight:700; cursor:pointer; }
  .btn-onglet-vue.actif { background:#14312a; border-color:#14312a; color:#fff; }
  .btn-archiver { background:#fff; border-color:#e0e5df; color:#8a6b4c; }
  .btn-desarchiver { background:#eaf4ef; border-color:#1e6f4c; color:#1e6f4c; }
  .btn-dashboard:hover { border-color:#14312a; }
  .badge-compte-cree { font-size:0.68rem; color:#1e6f4c; font-weight:700; margin-left:6px; }
  .badge-compte-absent { font-size:0.68rem; color:#8a9891; margin-left:6px; }

  .loading, .empty { text-align:center; padding:60px; color:#8a9891; font-size:0.92rem; }
  .feedback { font-size:0.74rem; margin-top:5px; font-weight:600; }
  .feedback.ok { color:#1e6f4c; }
  .feedback.err { color:#c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-header">
    <div>
      <h1>Mes artisans</h1>
      <p class="sub">Chaque artisan a sa propre fiche — envoie-lui son lien personnel pour qu'il dépose ses éléments.</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button type="button" id="btnMesRdvAdmin" class="btn-action" style="display:inline-block;">📅 Mes rendez-vous</button>
      <a href="/prospects-paysagiste.html" class="btn-action" style="text-decoration:none; display:inline-block;">📧 Prospection artisans</a>
    </div>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="filtre-row" style="display:flex; gap:12px; align-items:center;">
    <input type="text" id="recherche" placeholder="Rechercher par nom d'entreprise ou téléphone…" style="flex:1;">
    <div style="display:flex; gap:6px;">
      <button type="button" id="ongletActifs" class="btn-onglet-vue actif">Actifs</button>
      <button type="button" id="ongletArchives" class="btn-onglet-vue">📦 Archives</button>
    </div>
  </div>

  <div class="table-card">
    <div id="contenu"><div class="loading">Chargement…</div></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://wklddwumirkdjkbxvzyj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrbGRkd3VtaXJrZGprYnh2enlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMTMzNDksImV4cCI6MjA5ODc4OTM0OX0._2cVv3rmhHb-7VLTCqiMRq0F2S30NMnD8qRhTiBM7nc';
  const SITE_BASE = 'https://app.skyeco.fr';

  // 03/09 : petit pictogramme "4 couleurs" façon Google, utilisé uniquement
  // comme repère visuel sur le bouton de lien externe vers Google Ads — pas
  // une reproduction du logo officiel Google Ads, juste un indice couleur.
  const GOOGLE_ADS_ICON_SVG = `<svg width="13" height="13" viewBox="0 0 36 36" style="display:inline-block;"><path fill="#4285F4" d="M18 0a18 18 0 0118 18H18z"/><path fill="#34A853" d="M36 18a18 18 0 01-18 18V18z"/><path fill="#FBBC04" d="M18 36A18 18 0 010 18h18z"/><path fill="#EA4335" d="M0 18A18 18 0 0118 0v18z"/></svg>`;

  let toutesLesFiches = [];
  let vueArchives = false;

  chargerFiches();

  async function chargerFiches() {
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/skyeco_pro_vitrine_drafts?select=id,entreprise,metier,telephone,status,site_valide,archive,created_at,dashboard_password_hash&order=created_at.desc`, {
        headers: { apikey: SUPABASE_ANON_KEY }
      });
      toutesLesFiches = await resp.json();
      afficherStats(toutesLesFiches);
      afficherVueActuelle();
      chargerCompteursDemandes();
    } catch (e) {
      document.getElementById('contenu').innerHTML = '<div class="empty">Impossible de charger la liste pour le moment.</div>';
    }
  }

  function afficherVueActuelle() {
    const fichesVue = toutesLesFiches.filter(f => vueArchives ? f.archive : !f.archive);
    afficherTableau(fichesVue);
  }

  // Nombre de demandes reçues par artisan — un seul appel groupé (pas un
  // par artisan) pour rester léger même avec beaucoup d'inscrits ; complète
  // le tableau une fois chargé plutôt que de bloquer son premier affichage.
  async function chargerCompteursDemandes() {
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/skyeco_pro_leads?select=draft_id`, {
        headers: { apikey: SUPABASE_ANON_KEY }
      });
      const leads = await resp.json();
      const compteurs = {};
      leads.forEach(l => { compteurs[l.draft_id] = (compteurs[l.draft_id] || 0) + 1; });
      Object.entries(compteurs).forEach(([draftId, n]) => {
        const el = document.getElementById('demandes-' + draftId);
        if (el) el.textContent = `📩 ${n} demande${n > 1 ? 's' : ''}`;
      });
    } catch (e) { /* silencieux — le tableau reste utilisable sans ce détail */ }
  }

  function afficherStats(fichesToutes) {
    const fiches = fichesToutes.filter(f => !f.archive); // les archivés ne comptent plus dans le suivi actif
    const total = fiches.length;
    const publies = fiches.filter(f => f.status === 'published').length;
    const enAttente = fiches.filter(f => f.status === 'preview').length;
    const valides = fiches.filter(f => f.site_valide).length;

    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="valeur">${total}</div><div class="label">Artisans au total</div></div>
      <div class="stat-card accent-vert"><div class="valeur">${publies}</div><div class="label">Sites publiés</div></div>
      <div class="stat-card accent-orange"><div class="valeur">${enAttente}</div><div class="label">En attente</div></div>
      <div class="stat-card accent-vert"><div class="valeur">${valides}</div><div class="label">Vitrines validées</div></div>
    `;
  }

  function afficherTableau(fiches) {
    const contenu = document.getElementById('contenu');
    if (!fiches.length) {
      contenu.innerHTML = '<div class="empty">Aucun artisan pour l\'instant.</div>';
      return;
    }

    const STATUT_LABELS = {
      preview: '<span class="badge badge-preview">Aperçu</span>',
      published: '<span class="badge badge-published">Publié</span>',
      en_pause: '<span class="badge badge-desactive">En pause</span>',
      essai: '<span class="badge badge-preview">Essai gratuit</span>',
      essai_expire: '<span class="badge badge-desactive">Essai expiré</span>',
      desactive: '<span class="badge badge-desactive">Désactivé</span>',
    };

    contenu.innerHTML = `
      <table>
        <thead>
          <tr><th>Entreprise</th><th>Statut</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody>
          ${fiches.map(f => {
            const metiers = Array.isArray(f.metier) ? f.metier.join(', ') : (f.metier || '—');
            const date = new Date(f.created_at).toLocaleDateString('fr-FR');
            const lienElements = `${SITE_BASE}/mes-elements.html?id=${f.id}`;
            const initiale = (f.entreprise || '?').trim().charAt(0).toUpperCase();
            return `
              <tr>
                <td>
                  <div class="entreprise-cell">
                    <div class="avatar-initiale">${initiale}</div>
                    <div>
                      <div class="entreprise-nom">${f.entreprise || '—'}</div>
                      <div class="entreprise-metier">${metiers}</div>
                    </div>
                  </div>
                </td>
                <td>${STATUT_LABELS[f.status] || f.status || '—'}</td>
                <td class="date-cell">${date}</td>
                <td>
                  <div class="actions">
                    <button class="btn-action btn-copier" data-lien="${lienElements}" onclick="copierLien(this)">📋 Copier le lien</button>
                    <button class="btn-action btn-envoyer" data-id="${f.id}" onclick="envoyerLien(this)" ${!f.telephone ? 'disabled title="Aucun téléphone enregistré"' : ''}>📤 Envoyer par SMS</button>
                    <a class="btn-action btn-voir" href="/apercu.html?id=${f.id}" target="_blank">👁️ Voir</a>
                    <button class="btn-action ${f.site_valide ? 'btn-valide-on' : 'btn-valide-off'}" data-id="${f.id}" data-valide="${f.site_valide ? '1' : '0'}" onclick="toggleValidation(this)">${f.site_valide ? '✓ Site validé' : '☐ Valider le site'}</button>
                    <button class="btn-action btn-dashboard" data-id="${f.id}" onclick="ouvrirDashboardAdmin(this)">🔑 Dashboard</button>
                    <button class="btn-action btn-zone" data-id="${f.id}" onclick="ouvrirZoneAdmin(this)">📍 Zone &amp; km</button>
                    <a class="btn-action btn-google-ads" href="https://ads.google.com/aw/campaigns" target="_blank" rel="noopener">${GOOGLE_ADS_ICON_SVG} Google Ads</a>
                    <a class="btn-action btn-elements-admin" href="${lienElements}" target="_blank">✏️ Éléments</a>
                    <a class="btn-action btn-campagne-admin" href="${SITE_BASE}/campagne.html?id=${f.id}" target="_blank">📢 Campagne</a>
                    <button class="btn-action ${f.archive ? 'btn-desarchiver' : 'btn-archiver'}" data-id="${f.id}" data-archive="${f.archive ? '1' : '0'}" onclick="toggleArchive(this)">${f.archive ? '↩️ Désarchiver' : '📦 Archiver'}</button>
                  </div>
                  <div class="feedback" id="feedback-${f.id}">
                    ${f.dashboard_password_hash ? '<span class="badge-compte-cree">✓ Compte créé</span>' : '<span class="badge-compte-absent">Compte pas encore créé</span>'}
                    <span class="badge-compteur-demandes" id="demandes-${f.id}"></span>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  window.copierLien = function(btn) {
    const lien = btn.dataset.lien;
    navigator.clipboard.writeText(lien).then(() => {
      const original = btn.textContent;
      btn.textContent = '✓ Copié !';
      setTimeout(() => { btn.textContent = original; }, 1800);
    });
  };

  window.envoyerLien = async function(btn) {
    const draftId = btn.dataset.id;
    const feedbackEl = document.getElementById('feedback-' + draftId);
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Envoi…';
    try {
      const res = await fetch('/api/envoyer-lien-elements', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ draftId })
      });
      const data = await res.json();
      if (data.success) {
        feedbackEl.textContent = '✓ SMS envoyé';
        feedbackEl.className = 'feedback ok';
      } else {
        feedbackEl.textContent = data.error || 'Échec de l\'envoi';
        feedbackEl.className = 'feedback err';
      }
    } catch (e) {
      feedbackEl.textContent = 'Erreur de connexion';
      feedbackEl.className = 'feedback err';
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };

  // Bascule site_valide — simple suivi interne pour toi (ne bloque plus rien côté
  // artisan : choisir-forfait.html s'ouvre sans attendre cette validation). Sert à
  // repérer d'un coup d'œil les vitrines que tu as réellement vérifiées après coup.
  window.toggleValidation = async function(btn) {
    const draftId = btn.dataset.id;
    const nouvelEtat = btn.dataset.valide !== '1';
    const feedbackEl = document.getElementById('feedback-' + draftId);
    btn.disabled = true;
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/skyeco_pro_vitrine_drafts?id=eq.${draftId}`, {
        method: 'PATCH',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ site_valide: nouvelEtat })
      });
      if (!resp.ok) throw new Error();
      btn.dataset.valide = nouvelEtat ? '1' : '0';
      btn.textContent = nouvelEtat ? '✓ Site validé' : '☐ Valider le site';
      btn.className = 'btn-action ' + (nouvelEtat ? 'btn-valide-on' : 'btn-valide-off');
      const fiche = toutesLesFiches.find(f => String(f.id) === String(draftId));
      if (fiche) fiche.site_valide = nouvelEtat;
      afficherStats(toutesLesFiches);
    } catch (e) {
      feedbackEl.textContent = 'Échec de la mise à jour';
      feedbackEl.className = 'feedback err';
    } finally {
      btn.disabled = false;
    }
  };

  // Archiver ne supprime rien — juste un drapeau qui retire l'artisan de la
  // vue "Actifs" (et de son compteur de stats) sans toucher à ses données ;
  // tout reste consultable dans l'onglet Archives, désarchivable à tout
  // moment.
  window.toggleArchive = async function(btn) {
    const draftId = btn.dataset.id;
    const nouvelEtat = btn.dataset.archive !== '1';
    btn.disabled = true;
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/skyeco_pro_vitrine_drafts?id=eq.${draftId}`, {
        method: 'PATCH',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ archive: nouvelEtat })
      });
      if (!resp.ok) throw new Error();
      const fiche = toutesLesFiches.find(f => String(f.id) === String(draftId));
      if (fiche) fiche.archive = nouvelEtat;
      afficherStats(toutesLesFiches);
      afficherVueActuelle();
    } catch (e) {
      alert("Impossible de mettre à jour l'archivage pour le moment.");
      btn.disabled = false;
    }
  };

  document.getElementById('ongletActifs').addEventListener('click', () => {
    vueArchives = false;
    document.getElementById('ongletActifs').classList.add('actif');
    document.getElementById('ongletArchives').classList.remove('actif');
    afficherVueActuelle();
  });
  document.getElementById('ongletArchives').addEventListener('click', () => {
    vueArchives = true;
    document.getElementById('ongletArchives').classList.add('actif');
    document.getElementById('ongletActifs').classList.remove('actif');
    afficherVueActuelle();
  });

  // Bouton "Mes rendez-vous" (04/09) : ce sont les demandes de RDV que TOI
  // reçois (un artisan qui souhaite qu'on construise sa vitrine ensemble au
  // téléphone — bouton ajouté dans mes-elements.html), pas ceux de tel ou
  // tel artisan. Réutilise le module de RDV interne + le calendrier déjà
  // intégré à mon-dashboard.html, mais pointé sur TON identité dédiée
  // ("Skyeco Pro", créée le 04/09 dans skyeco_pro_vitrine_drafts, archivée
  // pour ne pas apparaître dans la liste ci-dessous) — même mécanisme
  // d'accès admin que ouvrirDashboardAdmin() ci-dessous, et #calendrier pour
  // atterrir directement sur l'onglet calendrier plutôt que sur Google Ads.
  const DRAFT_ID_SKYECO_PRO = '4fbdb122-9fca-4636-b80c-d9e4abc2542b';
  document.getElementById('btnMesRdvAdmin').addEventListener('click', async function() {
    const btn = this;
    const draftId = DRAFT_ID_SKYECO_PRO;
    let motDePasseInterne = sessionStorage.getItem('skyeco_admin_internal_pw');
    if (!motDePasseInterne) {
      motDePasseInterne = prompt('Mot de passe interne (admin) :');
      if (!motDePasseInterne) return;
    }
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Ouverture…';
    try {
      const res = await fetch('/api/dashboard-admin-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ draftId, motDePasseInterne })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('skyeco_admin_internal_pw', motDePasseInterne);
        window.open(`${SITE_BASE}/mon-dashboard.html?id=${draftId}&admin_token=${encodeURIComponent(data.token)}#calendrier`, '_blank');
      } else {
        sessionStorage.removeItem('skyeco_admin_internal_pw');
        alert(data.error || 'Mot de passe interne incorrect.');
      }
    } catch (e) {
      alert('Impossible de contacter le serveur.');
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  // Ouvre le dashboard d'un artisan sans connaître son mot de passe — sur
  // présentation du mot de passe interne (le même que celui des autres pages
  // d'admin). Demandé une seule fois par session de navigateur : conservé en
  // sessionStorage pour les clics suivants, exactement comme le fait déjà
  // prospects-paysagiste.html pour son propre accès.
  window.ouvrirDashboardAdmin = async function(btn) {
    const draftId = btn.dataset.id;
    let motDePasseInterne = sessionStorage.getItem('skyeco_admin_internal_pw');
    if (!motDePasseInterne) {
      motDePasseInterne = prompt('Mot de passe interne (admin) :');
      if (!motDePasseInterne) return;
    }
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Ouverture…';
    try {
      const res = await fetch('/api/dashboard-admin-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ draftId, motDePasseInterne })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('skyeco_admin_internal_pw', motDePasseInterne);
        window.open(`${SITE_BASE}/mon-dashboard.html?id=${draftId}&admin_token=${encodeURIComponent(data.token)}`, '_blank');
      } else {
        sessionStorage.removeItem('skyeco_admin_internal_pw');
        alert(data.error || 'Mot de passe interne incorrect.');
      }
    } catch (e) {
      alert('Impossible de contacter le serveur.');
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };

  // 03/09 : même mécanisme que ouvrirDashboardAdmin() ci-dessus, mais ouvre
  // directement sur la section "Où voulez-vous être visible ?" (zone/rayon
  // km) grâce à l'ancre #sectionZoneCiblee — mon-dashboard.html scrolle
  // jusque-là et ouvre le mode édition automatiquement quand ce hash est
  // présent (même logique que le lien envoyé par SMS/email dans
  // api/alerter-changement-zone.js).
  window.ouvrirZoneAdmin = async function(btn) {
    const draftId = btn.dataset.id;
    let motDePasseInterne = sessionStorage.getItem('skyeco_admin_internal_pw');
    if (!motDePasseInterne) {
      motDePasseInterne = prompt('Mot de passe interne (admin) :');
      if (!motDePasseInterne) return;
    }
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Ouverture…';
    try {
      const res = await fetch('/api/dashboard-admin-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ draftId, motDePasseInterne })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('skyeco_admin_internal_pw', motDePasseInterne);
        window.open(`${SITE_BASE}/mon-dashboard.html?id=${draftId}&admin_token=${encodeURIComponent(data.token)}#sectionZoneCiblee`, '_blank');
      } else {
        sessionStorage.removeItem('skyeco_admin_internal_pw');
        alert(data.error || 'Mot de passe interne incorrect.');
      }
    } catch (e) {
      alert('Impossible de contacter le serveur.');
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };

  document.getElementById('recherche').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const base = toutesLesFiches.filter(f => vueArchives ? f.archive : !f.archive);
    const filtrees = base.filter(f =>
      (f.entreprise || '').toLowerCase().includes(q) || (f.telephone || '').includes(q)
    );
    afficherTableau(filtrees);
  });
</script>
</body>
</html>
