// Ajoute la question de "quantité" (dont l'unité — m², ml, m³ ou forfait —
// vient directement de ce que l'artisan a lui-même configuré dans son
// chiffrage détaillé), puis les questions communes (détails, délai, localisation).
function pushQuantiteEtSuite(s, tarif, libelleSurface){
  s.push({ key:"details_projet", question:"Décrivez votre projet en quelques mots", type:"textarea",
    placeholder:"Ex : nature des travaux, contraintes particulières, délais souhaités…", optional:true });

  if(tarif && tarif.unite && tarif.unite !== 'forfait' && tarif.prix){
    const unites = { m2:'m²', ml:'mètres linéaires', m3:'m³' };
    const libelleUnite = unites[tarif.unite] || tarif.unite;
    s.push({ key:"quantite", question:`Quelle ${libelleSurface}, en ${libelleUnite} environ ?`, type:"number",
      placeholder:"Ex : 30" });
  }

  s.push({ key:"delai", question:"Sous quel délai souhaitez-vous réaliser ce projet ?", type:"choice",
    options:[["urgent","Le plus vite possible"],["1_3_mois","Dans 1 à 3 mois"],["plus_tard","Plus tard"]] });
  s.push({ key:"localisation", question:"Où se situe le projet ?", type:"location" });
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id){
    document.getElementById('loadingState').textContent = "Aucun aperçu à afficher — identifiant manquant dans l'adresse.";
    return;
  }

  const { data: draft, error } = await supabaseClient
    .from('skyeco_pro_vitrine_drafts')
    .select('*')
    .eq('id', id)
    .single();

  if(error || !draft){
    document.getElementById('loadingState').textContent = "Cet aperçu est introuvable ou a expiré.";
    return;
  }

  const metiersListe = Array.isArray(draft.metier) ? draft.metier : (draft.metier ? [draft.metier] : []);
  const metierChoisi = metiersListe[0] || 'autre';
  const template = METIER_TEMPLATES[metierChoisi] || METIER_TEMPLATES.autre;
  const tarifMetier = (draft.tarification_detail && draft.tarification_detail[metierChoisi]) || null;
  const tvaTaux = draft.tva_taux || 20;
  const brandColor = draft.couleur || '#E8622C';

  document.documentElement.style.setProperty('--brand', brandColor);
  document.documentElement.style.setProperty('--brand-tint', brandColor + '1A');
  document.documentElement.style.setProperty('--brand-dark', '#14312a');

  document.getElementById('heroTitle').innerHTML = template.heroTitre +
    '<span style="display:block; margin-top:14px; font-size:0.45em; font-weight:600; opacity:0.9;">' + draft.entreprise + '</span>';
  if (draft.logo_url) {
    const logoEl = document.getElementById('logoArtisan');
    logoEl.src = draft.logo_url;
    logoEl.style.display = 'block';
  }

  document.getElementById('eyebrow').textContent = draft.entreprise + ' — ' + template.eyebrow;
  document.getElementById('mainTitle').textContent = template.titre;
  document.getElementById('delaiBadge').textContent = template.delaiBadge;
  document.getElementById('introText').textContent = draft.description || template.intro;
  document.getElementById('miniBadges').innerHTML = ['✅ Sans engagement','⏱️ Réponse sous 24h','🔒 Données confidentielles'].map(b=>'<span>'+b+'</span>').join('');

  // Mentions légales complètes — n'affiche que ce qui a réellement été renseigné,
  // pour ne jamais montrer de champ vide même si l'artisan n'a pas tout complété.
  const adresseComplete = [draft.adresse_rue, draft.adresse_cp, draft.adresse_ville].filter(Boolean).join(' ');
  const formeEtCapital = [draft.forme_juridique, draft.capital_social ? `au capital de ${draft.capital_social}` : null].filter(Boolean).join(' ');
  const assurance = draft.assurance_decennale_assureur
    ? `Assurance décennale : ${draft.assurance_decennale_assureur}` + (draft.assurance_decennale_numero ? ` (n° ${draft.assurance_decennale_numero})` : '')
    : null;

  const lignesLegales = [
    draft.entreprise + (formeEtCapital ? ' — ' + formeEtCapital : ''),
    draft.siret ? `SIRET ${draft.siret}` : null,
    draft.rcs_ville ? `RCS ${draft.rcs_ville}` : null,
    adresseComplete || null,
    assurance,
    draft.zone ? 'Intervient sur : ' + draft.zone : null,
    [draft.telephone, draft.email].filter(Boolean).join(' — ') || null,
  ].filter(Boolean);

  document.getElementById('legalLine').innerHTML = lignesLegales.join('<br/>');

  const container = document.getElementById('heroImagePanel');
  if(draft.video_url){
    const video = document.createElement('video');
    video.src = draft.video_url;
    video.autoplay = true; video.muted = true; video.loop = true; video.playsInline = true;
    video.className = 'active';
    video.style.cssText = 'position:absolute; inset:0; width:100%; height:100%; object-fit:cover;';
    container.insertBefore(video, container.firstChild);
  } else {
    const metiersListeApercu = Array.isArray(draft.metier) ? draft.metier : (draft.metier ? [draft.metier] : []);
    const imagesFallback = metiersListeApercu.length
      ? [...new Set(metiersListeApercu.flatMap(m => FALLBACK_IMAGES[m] || []))]
      : FALLBACK_IMAGES.autre;
    const images = (draft.photos && draft.photos.length) ? draft.photos : (imagesFallback.length ? imagesFallback : FALLBACK_IMAGES.autre);
    const imgs = images.map((src,i)=>{ const img=document.createElement('img'); img.src=src; if(i===0) img.className='active'; container.appendChild(img); return img; });
    if(imgs.length>1){
      let idx=0;
      setInterval(()=>{ imgs[idx].classList.remove('active'); idx=(idx+1)%imgs.length; imgs[idx].classList.add('active'); }, 2500);
    }
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  if(draft.status === 'preview'){
    document.getElementById('previewBanner').style.display = 'flex';
  }
  if(draft.status === 'desactive'){
    document.getElementById('appRoot').innerHTML =
      '<div style="max-width:480px; margin:80px auto; text-align:center; padding:0 20px;">' +
      '<h2 style="margin-bottom:12px;">Cette page n\'est plus disponible</h2>' +
      '<p style="color:#5b6b64;">L\'abonnement de ce site est arrivé à son terme.</p>' +
      '</div>';
    return;
  }

  document.getElementById('btnPublier').addEventListener('click', ()=>{
    window.location.href = 'choisir-forfait.html?id=' + draft.id;
  });
  document.getElementById('btnFooterCallback').addEventListener('click', ()=>{
    const zone = document.getElementById('footerCallbackZone');
    zone.innerHTML =
      '<div style="max-width:320px; margin:0 auto; text-align:left;">'+
        '<input type="text" id="footerNom" placeholder="Votre nom" style="width:100%; border:1.5px solid #d8e3de; border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:8px;" />'+
        '<input type="tel" id="footerTel" placeholder="Votre téléphone" style="width:100%; border:1.5px solid #d8e3de; border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:10px;" />'+
        '<button class="btn btn-primary" id="btnFooterCallbackConfirm" style="width:100%; padding:10px;">Confirmer</button>'+
      '</div>';
    document.getElementById('btnFooterCallbackConfirm').addEventListener('click', async ()=>{
      const nomVal = document.getElementById('footerNom').value.trim();
      const telVal = document.getElementById('footerTel').value.trim();
      if(!nomVal || telVal.length < 8){ return; }
      zone.innerHTML = '<div style="font-size:13px; color:#5b6b64;">Envoi en cours…</div>';
      try {
        await fetch('/api/notify-nouvelle-demande', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ draftId: draft.id, nom: nomVal, telephone: telVal, reponses: { type_demande: 'rappel_rapide_footer' } })
        });
        zone.innerHTML = '<div style="font-size:13px; color:#1e6f4c; font-weight:600;">✅ Demande envoyée, on vous rappelle très vite !</div>';
      } catch (e) {
        zone.innerHTML = '<div style="font-size:13px; color:#c0392b;">Impossible d\'envoyer la demande. Réessayez.</div>';
      }
    });
  });

  // Retour depuis Stripe après paiement : on vérifie et on publie côté serveur.
  const returningSessionId = params.get('session_id');
  if (returningSessionId) {
    document.getElementById('previewBanner').innerHTML =
      '<span>⏳ Vérification du paiement en cours…</span>';
    try {
      const res = await fetch('/api/confirm-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: returningSessionId, draftId: draft.id })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('previewBanner').style.background = '#1e6f4c';
        document.getElementById('previewBanner').innerHTML =
          '<span>✅ Votre mini-site est maintenant en ligne.</span>';
      } else {
        document.getElementById('previewBanner').innerHTML =
          "<span>⚠️ " + (data.error || "Le paiement n'a pas pu être confirmé.") + "</span>";
      }
    } catch (err) {
      document.getElementById('previewBanner').innerHTML =
        '<span>⚠️ Impossible de vérifier le paiement pour le moment.</span>';
    }
  } else if (params.get('paiement') === 'annule') {
    document.getElementById('previewBanner').innerHTML =
      '<span>Paiement annulé — vous pouvez réessayer quand vous voulez.</span>';
  }

  runWizard(template, brandColor, draft.id, tarifMetier, tvaTaux, draft);
}

function runWizard(template, brandColor, draftId, tarifMetier, tvaTaux, draftInfo){
  const state = { step:0 };
  const cardEl = document.getElementById('card');
  const progressEl = document.getElementById('progress');
  function getSteps(){ return template.getSteps(state, tarifMetier); }
  function renderProgress(){
    const steps = getSteps(); progressEl.innerHTML='';
    const total = steps.length+1;
    for(let i=0;i<total;i++){ const seg=document.createElement('div'); seg.className='progress-seg'+(i<=state.step?' done':''); progressEl.appendChild(seg); }
  }
  function canProceed(s){
    if(!s) return true;
    if(s.type==='choice') return !!state[s.key];
    if(s.type==='number') return state[s.key] && parseFloat(state[s.key])>0;
    if(s.type==='location') return state.code_postal && state.code_postal.length===5;
    if(s.type==='identity') return state.nom && state.telephone && state.telephone.length>=8 && state.telephoneVerifie && state.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email) && state.rgpdAccepte;
    return true;
  }
  function renderStep(){
    const steps=getSteps(); if(state.step>=steps.length) state.step=steps.length-1;
    const s=steps[state.step];
    let html = '<div class="step-label">Étape '+(state.step+1)+' sur '+steps.length+'</div>';
    html += '<div class="question">'+s.question+'</div>';
    if(s.type==='choice'){
      html+='<div class="options">';
      s.options.forEach(([val,label])=>{ const sel=state[s.key]===val?' selected':''; html+='<div class="option'+sel+'" data-val="'+val+'">'+label+'</div>'; });
      html+='</div>';
    } else if(s.type==='number'){
      html+='<input type="number" id="inputNum" placeholder="'+s.placeholder+'" value="'+(state[s.key]||'')+'" min="1" />';
    } else if(s.type==='location'){
      html+='<label class="field-label">Ville</label><input type="text" id="inputVille" placeholder="Ex : Brech" value="'+(state.ville||'')+'" />'+
        '<label class="field-label">Code postal</label><input type="text" id="inputCP" placeholder="Ex : 56400" value="'+(state.code_postal||'')+'" maxlength="5" />';
    } else if(s.type==='identity'){
      html+='<label class="field-label">Nom</label><input type="text" id="inputNom" value="'+(state.nom||'')+'" />'+
        '<label class="field-label">Prénom</label><input type="text" id="inputPrenom" value="'+(state.prenom||'')+'" />'+
        '<label class="field-label">Téléphone</label><input type="tel" id="inputTel" value="'+(state.telephone||'')+'" placeholder="06 XX XX XX XX" />'+
        '<div id="smsStatusApercu" style="font-size:13px; margin:6px 0 4px;"></div>'+
        (state.telephoneVerifie
          ? '<div style="font-size:13px; color:#1e6f4c; font-weight:600; margin-bottom:10px;">✓ Numéro vérifié</div>'
          : '<button type="button" id="btnEnvoyerCodeApercu" style="background:#eaf4ef;color:#1e6f4c;border:1.5px solid #1e6f4c;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;" disabled>Vérifier mon numéro par SMS</button>'+
            '<div id="smsCodeRowApercu" style="display:none; gap:8px; margin-bottom:10px;">'+
              '<input type="text" id="smsCodeApercu" inputmode="numeric" maxlength="6" placeholder="Code reçu" style="flex:1; letter-spacing:.3em; text-align:center; border:1.5px solid #d8e3de; border-radius:8px; padding:10px;" />'+
              '<button type="button" id="btnVerifierCodeApercu" style="background:#eaf4ef;color:#1e6f4c;border:1.5px solid #1e6f4c;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;">Valider</button>'+
            '</div>')+
        '<label class="field-label">Email</label><input type="email" id="inputEmail" value="'+(state.email||'')+'" />'+
        '<label style="display:flex; align-items:flex-start; gap:8px; margin-top:14px; font-size:12.5px; color:#5b6b64; line-height:1.5; cursor:pointer;">'+
          '<input type="checkbox" id="checkRgpd" style="margin-top:2px; flex-shrink:0;" '+(state.rgpdAccepte?'checked':'')+' />'+
          '<span>J\'accepte que mes données soient transmises à l\'artisan pour traiter ma demande, conformément à la <a href="/politique-confidentialite.html" target="_blank">politique de confidentialité</a>. *</span>'+
        '</label>'+
        '<label style="display:flex; align-items:flex-start; gap:8px; margin-top:8px; font-size:12.5px; color:#5b6b64; line-height:1.5; cursor:pointer;">'+
          '<input type="checkbox" id="checkMarketing" style="margin-top:2px; flex-shrink:0;" '+(state.marketingAccepte?'checked':'')+' />'+
          '<span>J\'accepte de recevoir par SMS et email le suivi de ma demande et d\'éventuelles relances (désabonnement possible à tout moment).</span>'+
        '</label>';
    } else if(s.type==='textarea'){
      html+='<textarea id="inputTextarea" placeholder="'+(s.placeholder||'')+'" style="width:100%; min-height:110px; border:1.5px solid #d8e3de; border-radius:10px; padding:12px 14px; font-size:15px; font-family:inherit; resize:vertical;">'+(state[s.key]||'')+'</textarea>'+
        (s.optional ? '<div style="font-size:12px; color:#8a9490; margin-top:6px;">Facultatif — passez si vous préférez.</div>' : '');
    }
    html += '<div class="nav-row"><button class="btn btn-ghost" id="btnBack"'+(state.step===0?" style='visibility:hidden'":'')+'>← Retour</button>'+
      '<button class="btn btn-primary" id="btnNext" disabled>Continuer</button></div>';
    cardEl.innerHTML = html;
    wireStepEvents(s, steps);
    document.getElementById('btnNext').disabled = !canProceed(s);
  }
  function wireStepEvents(s, steps){
    if(s.type==='choice'){
      cardEl.querySelectorAll('.option').forEach(el=>{ el.addEventListener('click',()=>{ state[s.key]=el.dataset.val; renderProgress(); renderStep(); }); });
    } else if(s.type==='number'){
      const input=document.getElementById('inputNum');
      input.addEventListener('input',()=>{ state[s.key]=input.value; document.getElementById('btnNext').disabled=!canProceed(s); });
      input.focus();
    } else if(s.type==='location'){
      const ville=document.getElementById('inputVille'), cp=document.getElementById('inputCP');
      ville.addEventListener('input',()=>{ state.ville=ville.value; });
      cp.addEventListener('input',()=>{ state.code_postal=cp.value; document.getElementById('btnNext').disabled=!canProceed(s); });
      ville.focus();
    } else if(s.type==='identity'){
      const nom=document.getElementById('inputNom'), prenom=document.getElementById('inputPrenom'), tel=document.getElementById('inputTel'), email=document.getElementById('inputEmail');
      [nom,prenom,email].forEach(el=>{ el.addEventListener('input',()=>{ state.nom=nom.value; state.prenom=prenom.value; state.email=email.value; document.getElementById('btnNext').disabled=!canProceed(s); }); });
      document.getElementById('checkRgpd').addEventListener('change', (e)=>{ state.rgpdAccepte = e.target.checked; document.getElementById('btnNext').disabled=!canProceed(s); });
      document.getElementById('checkMarketing').addEventListener('change', (e)=>{ state.marketingAccepte = e.target.checked; });
      tel.addEventListener('input',()=>{
        state.telephone = tel.value;
        state.telephoneVerifie = false;
        const btn = document.getElementById('btnEnvoyerCodeApercu');
        if(!btn){ renderStep(); return; }
        const digits = tel.value.replace(/\D/g,'');
        btn.disabled = digits.length !== 10;
        document.getElementById('btnNext').disabled = !canProceed(s);
      });
      const btnEnvoyer = document.getElementById('btnEnvoyerCodeApercu');
      if(btnEnvoyer){
        btnEnvoyer.disabled = !(state.telephone && state.telephone.replace(/\D/g,'').length===10);
        btnEnvoyer.addEventListener('click', async ()=>{
          const statusEl = document.getElementById('smsStatusApercu');
          btnEnvoyer.disabled = true;
          statusEl.textContent = 'Envoi du code…';
          statusEl.style.color = '#8a9490';
          try{
            const res = await fetch('/api/verify-send-code', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ telephone: state.telephone })
            });
            const data = await res.json();
            if(!data.success) throw new Error(data.error || "Erreur lors de l'envoi.");
            document.getElementById('smsCodeRowApercu').style.display = 'flex';
            statusEl.textContent = 'Code envoyé par SMS.';
            statusEl.style.color = '#1e6f4c';
          } catch(err){
            statusEl.textContent = err.message;
            statusEl.style.color = '#c0392b';
          } finally {
            btnEnvoyer.disabled = false;
          }
        });
      }
      const btnVerifier = document.getElementById('btnVerifierCodeApercu');
      if(btnVerifier){
        btnVerifier.addEventListener('click', async ()=>{
          const statusEl = document.getElementById('smsStatusApercu');
          const codeInput = document.getElementById('smsCodeApercu');
          btnVerifier.disabled = true;
          statusEl.textContent = 'Vérification…';
          statusEl.style.color = '#8a9490';
          try{
            const res = await fetch('/api/verify-check-code', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ telephone: state.telephone, code: codeInput.value.trim() })
            });
            const data = await res.json();
            if(!data.success || !data.verified) throw new Error(data.error || 'Code invalide.');
            state.telephoneVerifie = true;
            renderStep();
          } catch(err){
            statusEl.textContent = err.message;
            statusEl.style.color = '#c0392b';
          } finally {
            btnVerifier.disabled = false;
            document.getElementById('btnNext').disabled = !canProceed(s);
          }
        });
      }
      nom.focus();
    } else if(s.type==='textarea'){
      const ta=document.getElementById('inputTextarea');
      ta.addEventListener('input',()=>{ state[s.key]=ta.value; });
      ta.focus();
    }
    document.getElementById('btnBack').addEventListener('click',()=>{ if(state.step>0){ state.step-=1; renderProgress(); renderStep(); } });
    document.getElementById('btnNext').addEventListener('click',()=>{
      if(!canProceed(s)) return;
      if(state.step<steps.length-1){ state.step+=1; renderProgress(); renderStep(); }
      else {
        enregistrerDemande();
      }
    });
  }
  // Calcule un prix indicatif si l'artisan a configuré un chiffrage précis
  // pour ce métier (unité + prix unitaire, saisis dans mes-elements.html).
  function calculerEstimation(){
    if(!tarifMetier || !tarifMetier.prix) return { chiffrable:false };
    let montantHT;
    if(tarifMetier.unite === 'forfait'){
      montantHT = tarifMetier.prix;
    } else {
      const quantite = parseFloat(state.quantite);
      if(!quantite || quantite <= 0) return { chiffrable:false };
      montantHT = quantite * tarifMetier.prix;
      if(tarifMetier.minimum) montantHT = Math.max(montantHT, tarifMetier.minimum);
    }
    const montantTTC = +(montantHT * (1 + tvaTaux/100)).toFixed(2);
    const remisePourcent = 10; // remise indicative, à confirmer par l'artisan selon le volume réel
    const montantApresRemise = +(montantTTC * (1 - remisePourcent/100)).toFixed(2);
    return { chiffrable:true, montantHT:+montantHT.toFixed(2), montantTTC, remisePourcent, montantApresRemise };
  }

  async function enregistrerDemande(){
    cardEl.innerHTML = '<div class="question" style="text-align:center;">Enregistrement de votre demande…</div>';
    document.getElementById('progress').style.display = 'none';

    // Sépare les champs identité (colonnes dédiées) du reste (stocké en jsonb "reponses").
    const { nom, prenom, telephone, telephoneVerifie, email, ...reste } = state;
    const estimation = calculerEstimation();

    let error = null;
    let leadId = null;
    try {
      const resp = await fetch('/api/notify-nouvelle-demande', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          draftId, nom, prenom, telephone, telephoneVerifie, email,
          reponses: { ...reste, estimation_indicative: estimation.chiffrable ? estimation.montantTTC : null }
        })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        error = data.error || 'Erreur serveur';
      } else {
        leadId = data.leadId || null;
      }
    } catch (e) {
      error = e.message;
    }

    if(error){
      cardEl.innerHTML = '<div class="question" style="text-align:center;">Une erreur est survenue.</div>'+
        '<div class="result-box" style="border-color:#c0392b; background:#fdecea;"><div class="result-note" style="color:#c0392b;">'+
        "Votre demande n'a pas pu être enregistrée. Merci de réessayer ou de nous contacter directement par téléphone."+
        '</div></div>'+
        '<div class="nav-row"><button class="btn btn-primary" id="btnRetryEnregistrement" style="flex:1;">Réessayer</button></div>';
      document.getElementById('btnRetryEnregistrement').addEventListener('click', enregistrerDemande);
      return;
    }

    renderResultat(estimation, leadId);
  }

  function renderResultat(estimation, leadId){
    let priceBlock;
    if(estimation.chiffrable){
      priceBlock =
        '<div class="result-box">'+
          '<div class="result-note">Estimation indicative</div>'+
          '<div class="result-price">'+estimation.montantTTC+' € TTC</div>'+
          '<div class="result-note">TVA à '+tvaTaux+'% incluse.</div>'+
        '</div>'+
        '<div style="background:var(--brand-tint,#eaf4ef); border:1.5px solid var(--brand,#1e6f4c); border-radius:10px; padding:12px 14px; margin-top:10px; font-size:13px; color:#14312a; text-align:center;">'+
          '🎁 <strong>Remise de '+estimation.remisePourcent+'% possible selon le projet</strong><br/>'+
          'Soit <strong>'+estimation.montantApresRemise+' €</strong> au lieu de '+estimation.montantTTC+' € — à confirmer avec l\'artisan.'+
        '</div>';
    } else {
      priceBlock = '<div class="result-box"><div class="result-note">Votre projet nécessite une évaluation personnalisée par l\'artisan.</div></div>';
    }

    cardEl.innerHTML =
      '<div class="success-icon">✅</div>'+
      '<div class="question" style="text-align:center;">Merci '+(state.prenom||'')+' !</div>'+
      priceBlock+
      '<p class="disclaimer">Cette estimation reste indicative et devra être confirmée par l\'artisan lors d\'un appel téléphonique. Vous recevrez ce récapitulatif par email.</p>'+
      '<div id="rdvSection">'+
        '<button class="btn btn-primary" id="btnVoirCreneaux" style="width:100%; margin-top:10px;">📅 Choisir un créneau pour être rappelé·e</button>'+
      '</div>';

    document.getElementById('btnVoirCreneaux').addEventListener('click', () => afficherCreneaux(leadId));
  }

  // Génère les 5 prochains jours ouvrés, avec 2 créneaux chacun — solution
  // simple sans dépendre d'un vrai système de calendrier par artisan.
  function genererCreneaux(){
    const creneaux = [];
    let date = new Date();
    let joursAjoutes = 0;
    while(creneaux.length < 10){
      date = new Date(date.getTime() + 24*60*60*1000);
      const jourSemaine = date.getDay();
      if(jourSemaine === 0 || jourSemaine === 6) continue; // week-end exclu
      [10, 15].forEach(heure => {
        const creneau = new Date(date);
        creneau.setHours(heure, 0, 0, 0);
        creneaux.push(creneau);
      });
    }
    return creneaux.slice(0, 8);
  }

  function afficherCreneaux(leadId){
    const section = document.getElementById('rdvSection');
    const creneaux = genererCreneaux();
    const optionsHtml = creneaux.map(d => {
      const label = new Intl.DateTimeFormat('fr-FR', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Paris' }).format(d);
      return '<div class="option" data-iso="'+d.toISOString()+'">'+label+'</div>';
    }).join('');
    section.innerHTML =
      '<div class="step-label" style="margin-top:12px;">Choisissez un créneau d\'appel</div>'+
      '<div class="options" id="creneauxOptions">'+optionsHtml+'</div>';
    section.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => confirmerCreneau(el.dataset.iso, leadId));
    });
  }

  async function confirmerCreneau(iso, leadId){
    const section = document.getElementById('rdvSection');
    section.innerHTML = '<div style="text-align:center; padding:14px 0; color:#5b6b64; font-size:13.5px;">Confirmation en cours…</div>';
    const label = new Intl.DateTimeFormat('fr-FR', { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Paris' }).format(new Date(iso));
    try {
      await fetch('/api/notify-nouvelle-demande', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          draftId, nom: state.nom, prenom: state.prenom, telephone: state.telephone,
          telephoneVerifie: state.telephoneVerifie, email: state.email,
          reponses: { rdv_choisi: iso, rdv_choisi_libelle: label }
        })
      });
      section.innerHTML =
        '<div class="result-box" style="margin-top:12px;">'+
          '<div class="result-note">✅ Rendez-vous demandé</div>'+
          '<div class="result-price" style="font-size:18px;">'+label+'</div>'+
          '<div class="result-note">L\'artisan vous appellera à ce créneau, sous réserve de confirmation.</div>'+
        '</div>';
    } catch (e) {
      section.innerHTML = '<div style="text-align:center; padding:10px 0; color:#c0392b; font-size:13.5px;">Impossible de confirmer pour le moment. Réessayez.</div>';
    }
  }

  renderProgress();
  renderStep();
}

init();
</script>
