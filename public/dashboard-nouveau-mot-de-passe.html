<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Skyeco Pro</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#f5f8f6; color:#14312a; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card { background:#fff; border-radius:18px; padding:36px 32px; max-width:420px; width:100%; box-shadow:0 8px 30px rgba(20,49,42,0.08); }
  h1 { font-size:1.3rem; margin-bottom:6px; }
  .sub { color:#5b6b64; font-size:0.88rem; margin-bottom:24px; line-height:1.5; }
  label { display:block; font-size:0.82rem; font-weight:700; margin-bottom:6px; margin-top:14px; }
  input {
    width:100%; padding:11px 14px; border:1.5px solid #d7dedb; border-radius:10px; font-size:0.95rem;
    font-family:inherit; color:#14312a;
  }
  input:focus { outline:none; border-color:#1e6f4c; }
  .btn-principal {
    width:100%; background:#1e6f4c; color:#fff; border:none; border-radius:10px; padding:13px;
    font-size:0.92rem; font-weight:700; cursor:pointer; margin-top:22px;
  }
  .btn-principal:hover { filter:brightness(1.05); }
  .btn-principal:disabled { opacity:0.5; cursor:wait; }
  .msg { font-size:0.85rem; padding:10px 14px; border-radius:10px; margin-top:16px; line-height:1.5; }
  .msg.err { background:#fdeaea; color:#991b1b; }
  .msg.ok { background:#eaf4ef; color:#1e6f4c; }
  .loading { text-align:center; padding:20px 0; color:#5b6b64; }
</style>
</head>
<body>
<div class="card" id="carte">
  <h1>Choisissez un nouveau mot de passe</h1>
  <p class="sub">Ce lien est valable 1 heure.</p>
  <form id="formReset">
    <label>Nouveau mot de passe</label>
    <input type="password" id="mdp1" minlength="8" required placeholder="8 caractères minimum">
    <label>Confirmez le mot de passe</label>
    <input type="password" id="mdp2" minlength="8" required>
    <button class="btn-principal" type="submit">Enregistrer</button>
  </form>
  <div id="zoneMsg"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const draftId = params.get('id');
  const token = params.get('token');

  if (!draftId || !token) {
    document.getElementById('carte').innerHTML = '<div class="loading">Lien invalide ou incomplet.</div>';
  } else {
    document.getElementById('formReset').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mdp1 = document.getElementById('mdp1').value;
      const mdp2 = document.getElementById('mdp2').value;
      const zoneMsg = document.getElementById('zoneMsg');
      const btn = e.target.querySelector('button');

      if (mdp1 !== mdp2) {
        zoneMsg.innerHTML = '<div class="msg err">Les deux mots de passe ne correspondent pas.</div>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Enregistrement…';
      try {
        const res = await fetch('/api/dashboard-reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ draftId, token, nouveauMotDePasse: mdp1 })
        });
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('skyeco_dashboard_token_' + draftId, data.token);
          zoneMsg.innerHTML = '<div class="msg ok">✓ Mot de passe mis à jour, redirection…</div>';
          setTimeout(() => { window.location.href = '/mon-dashboard.html?id=' + draftId; }, 1000);
        } else {
          zoneMsg.innerHTML = `<div class="msg err">${data.error || 'Une erreur est survenue.'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Enregistrer';
        }
      } catch (e) {
        zoneMsg.innerHTML = '<div class="msg err">Impossible de contacter le serveur.</div>';
        btn.disabled = false;
        btn.textContent = 'Enregistrer';
      }
    });
  }
</script>
</body>
</html>
