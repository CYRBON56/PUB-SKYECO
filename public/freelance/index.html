<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Skyeco — Mes prospects</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#F3F5F8;color:#14213D}
.top{background:#14213D;color:#fff;padding:14px 18px;font-weight:800}.in{max-width:760px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #E3E9EE}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:#2F9E6A;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.5}
.hint{color:#5B6876;font-size:14px}select,textarea{width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:10px;font:inherit;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#E0E7FF;color:#1E3160}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14213D;color:#fff;padding:12px 18px;border-radius:12px;max-width:92%;display:none}

.fiche{font-size:14px;color:#334155;line-height:1.7;margin:8px 0}.fiche a{color:#1E3160}.l2{flex:1;background:#fff;color:#14213D;border:1px solid #CBD5E1;font-size:15px;padding:10px}.appel{width:100%;font-size:18px;padding:14px;margin-top:4px}
input{width:100%;padding:10px;border:1px solid #CBD5E1;border-radius:10px;margin-bottom:10px}</style></head>
<body><div class="top">📞 Skyeco — Standard commercial</div><div class="in" id="app"><p class="hint">Chargement…</p></div><div class="msg" id="msg"></div>
<script>
const C=new URLSearchParams(location.search).get('c')||'',$=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIB={a_appeler:'À appeler',a_rappeler:'À rappeler',interesse:'Intéressé',pas_interesse:'Pas intéressé',client:'Client signé',injoignable:'Injoignable',termine:'✅ Terminé',archive:'🗄️ Archivé'};
let P=[],F='',Q='',N='',PG=0,TOT=0,ACT=0,MAX=100,CR={regions:[],metiers:[]};
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',7000)}
async function charger(){const u=new URLSearchParams({action:'liste',c:C,page:PG});if(F)u.set('statut',F);if(Q)u.set('q',Q);
 const r=await fetch('/api/standard-freelance?'+u).then(r=>r.json()).catch(()=>({erreur:'Connexion impossible'}));
 if(r.erreur){$('app').innerHTML='<div class="card">'+esc(r.erreur)+'</div>';return}P=r.prospects;N=r.prenom;TOT=r.total;ACT=r.actifs;MAX=r.max;CR=r.criteres;vue()}
let tq;function cherche(v){Q=v;clearTimeout(tq);tq=setTimeout(()=>{PG=0;charger()},500)}
async function recevoir(bt){const region=$('cr').value,metier=$('cm').value;if(!region&&!metier)return toast('Choisissez une région ou une activité.');bt.disabled=true;
 const r=await fetch('/api/standard-freelance?action=attribuer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:C,region,metier})}).then(r=>r.json()).catch(()=>({erreur:'Connexion impossible'}));
 toast(r.erreur||r.message);bt.disabled=false;PG=0;charger()}
function vue(){const prenom=N,np=Math.ceil(TOT/50),place=MAX-ACT;
 $('app').innerHTML=(prenom?`<p><b>Bonjour ${esc(prenom)}</b> — pour appeler : bouton vert (le prospect voit le numéro Skyeco) ou touchez le numéro (appel depuis votre téléphone). « Terminé » ou « Archiver » quand c'est fini : cela libère une place.</p>`:'')+
 `<div class="card"><b>📦 Mes prospects en cours : ${ACT} / ${MAX}</b>${place>0?`<p class="hint">Choisissez une région et/ou une activité pour recevoir jusqu'à ${place} nouveaux prospects.</p>
 <select id="cr"><option value="">Toutes les régions</option>${CR.regions.map(x=>`<option value="${esc(x.v)}">${esc(x.v)} (${x.n})</option>`).join('')}</select>
 <select id="cm"><option value="">Toutes les activités</option>${CR.metiers.map(x=>`<option value="${esc(x.v)}">${esc(x.v)} (${x.n})</option>`).join('')}</select>
 <button class="btn" style="width:100%;margin-top:8px" onclick="recevoir(this)">Recevoir mes prospects</button>`:`<p class="hint">Liste complète. Terminez ou archivez des prospects pour en recevoir d'autres.</p>`}</div>`+
 `<input placeholder="Rechercher dans ma liste : entreprise, ville, métier ou n° de département" value="${esc(Q)}" oninput="cherche(this.value)"><select onchange="F=this.value;PG=0;charger()"><option value="">Tous les statuts (sauf archivés)</option>${Object.entries(LIB).map(([k,v])=>`<option value="${k}" ${F===k?'selected':''}>${v}</option>`).join('')}</select><p class="hint">${TOT} prospect(s)</p>`+
 (P.map(p=>`<div class="card"><div style="font-size:17px"><b>${esc(p.entreprise||p.nom||'—')}</b> <span class="pill">${LIB[p.statut]||p.statut}</span></div>
 <div class="fiche">${p.metier?`<div>🛠️ ${esc(p.metier)}</div>`:''}<div>📍 ${esc([p.adresse,p.ville,p.departement?'('+p.departement+')':''].filter(Boolean).join(' '))}</div>
 ${p.siret?`<div>🏢 SIRET ${esc(p.siret)} · <a href="https://annuaire-entreprises.data.gouv.fr/etablissement/${esc(p.siret)}" target="_blank" rel="noopener">fiche officielle</a></div>`:''}
 ${p.email?`<div>✉️ <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>`:''}${p.site_web?`<div>🌐 <a href="${esc(/^https?:/.test(p.site_web)?p.site_web:'https://'+p.site_web)}" target="_blank" rel="noopener">${esc(p.site_web.replace(/^https?:\/\//,''))}</a></div>`:''}
 <div>📞 <a href="tel:${esc(p.telephone)}" onclick="direct('${p.id}')"><b>${esc(p.telephone)}</b></a>${p.dernier?` · <b style="color:#B45309">déjà appelé le</b> ${new Date(p.dernier.created_at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`:''}</div></div>
 <button class="btn appel" onclick="appeler('${p.id}',this)">📞 Appeler avec l'appli Skyeco</button>
 <div class="row" style="margin-top:8px"><button class="btn l2" onclick="maj('${p.id}',{statut:'termine'})">✅ Terminé</button><button class="btn l2" onclick="maj('${p.id}',{statut:'archive'})">🗄️ Archiver</button></div>
 <select onchange="maj('${p.id}',{statut:this.value})">${Object.entries(LIB).map(([k,v])=>`<option value="${k}" ${p.statut===k?'selected':''}>${v}</option>`).join('')}</select>
 <textarea rows="2" placeholder="Note (rappel, besoin…)" onchange="maj('${p.id}',{note:this.value})">${esc(p.note||'')}</textarea></div>`).join('')||'<p class="hint">Aucun prospect pour le moment.</p>')+
 (np>1?`<div class="row" style="margin:10px 0"><button class="btn" ${PG?'':'disabled'} onclick="PG--;charger();scrollTo(0,0)">◀</button><span class="hint">Page ${PG+1} / ${np}</span><button class="btn" ${PG+1<np?'':'disabled'} onclick="PG++;charger();scrollTo(0,0)">▶</button></div>`:'')}
async function appeler(id,bt){bt.disabled=true;const r=await fetch('/api/standard-freelance?action=appeler',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:C,prospect_id:id})}).then(r=>r.json()).catch(()=>({erreur:'Connexion impossible'}));
 toast(r.erreur||r.message);setTimeout(()=>bt.disabled=false,20000)}
function direct(id){const p=P.find(x=>x.id===id);p.dernier={created_at:new Date().toISOString()};fetch('/api/standard-freelance?action=appel_direct',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:C,prospect_id:id}),keepalive:true});setTimeout(vue,500)}
async function maj(id,o){const p=P.find(x=>x.id===id);Object.assign(p,o);await fetch('/api/standard-freelance?action=statut',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:C,prospect_id:id,...o})});toast(o.statut==='archive'?'Archivé':'Enregistré');if(o.statut)charger()}
charger();
</script></body></html>
