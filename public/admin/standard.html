<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Standard freelances — Administration Skyeco</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#F3F5F8;color:#14213D}
.top{background:#14213D;color:#fff;padding:14px 20px;font-weight:800;display:flex;gap:10px;align-items:center}.top a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;font-size:14px}
.in{max-width:1000px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #E3E9EE}
.btn{background:#F5B700;color:#14213D;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.l{background:#fff;border:1px solid #CBD5E1}
.hint{color:#5B6876;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
input,select,textarea{padding:9px;border:1px solid #CBD5E1;border-radius:10px;font:inherit}textarea{width:100%}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#E0E7FF;color:#1E3160}.fort{background:#DCFCE7;color:#166534}.faible,.aucun{background:#FEE2E2;color:#991B1B}
.tabs button{border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;margin-right:6px}.tabs button.on{background:#14213D;color:#fff}
details summary{cursor:pointer;font-weight:700;margin-top:8px}pre{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#F8FAFC;padding:10px;border-radius:10px}audio{width:100%;margin-top:8px}</style></head>
<body><div class="top"><a href="/admin/">◀ Administration</a><span>📞 Standard des commerciaux freelances</span></div><div class="in" id="app"><p class="hint">Chargement…</p></div>
<script>
const $=i=>document.getElementById(i),ADM=(localStorage.getItem('map_admin')||'')+':'+(sessionStorage.getItem('map_pin')||'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=x=>new Date(x).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const api=(a,o={})=>fetch('/api/standard-freelance?action='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin:ADM,...o})}).then(r=>r.json());
let D=null,T=location.hash.slice(1)||'appels';
async function charger(){D=await api('admin_liste');if(D.erreur){$('app').innerHTML='<div class="card">Ouvrez d’abord <a href="/admin/">l’administration</a> avec votre code, puis revenez ici.</div>';return}vue()}
const nomF=id=>{const f=D.freelances.find(x=>x.id===id);return f?f.prenom+(f.nom?' '+f.nom:''):'—'};
const nomP=id=>{const p=D.prospects.find(x=>x.id===id);return p?[p.nom,p.entreprise].filter(Boolean).join(' · '):'—'};
function vue(){const tabs=[['appels','🎧 Appels ('+D.appels.length+')'],['freelances','👥 Freelances ('+D.freelances.length+')'],['prospects','📋 Prospects suivis ('+D.prospects.length+')']];
 let h=`<div class="tabs" style="margin-bottom:12px">${tabs.map(([k,l])=>`<button class="${T===k?'on':''}" onclick="T='${k}';location.hash=T;vue()">${l}</button>`).join('')}</div>`;
 if(T==='appels')h+=D.appels.map(a=>`<div class="card"><div class="row"><div><b>${esc(nomF(a.freelance_id))}</b> → ${esc(nomP(a.prospect_id))}<div class="hint">${fd(a.created_at)} · ${esc(a.statut)}${a.duree?' · '+Math.round(a.duree/60*10)/10+' min':''}</div></div>${a.interet?`<span class="pill ${esc(a.interet)}">Intérêt : ${esc(a.interet)}</span>`:''}</div>
 ${a.resume?`<p>${esc(a.resume)}</p>`:''}
 ${a.recording_sid?`<audio controls preload="none" src="/api/standard-freelance?action=audio&id=${a.id}&admin=${encodeURIComponent(ADM)}"></audio>`:''}
 ${a.transcription?`<details><summary>Transcription complète</summary><pre>${esc(a.transcription)}</pre></details>`:''}</div>`).join('')||'<div class="card hint">Aucun appel pour le moment.</div>';
 if(T==='freelances')h+=`<div class="card"><b>Ajouter un freelance</b><div class="row" style="margin-top:8px"><input id="fp" placeholder="Prénom"><input id="fn" placeholder="Nom"><input id="ft" placeholder="Portable (06…)"><button class="btn" onclick="ajoutF()">Ajouter</button></div><p class="hint">C’est ce portable qui sonnera quand il cliquera sur « Appeler ».</p></div>`+
  D.freelances.map(f=>{const lien=location.origin+'/freelance/?c='+f.code_acces,n=D.appels.filter(a=>a.freelance_id===f.id).length;return `<div class="card"><div class="row"><div><b>${esc(f.prenom)} ${esc(f.nom||'')}</b> <span class="hint">${esc(f.telephone)} · ${D.prospects.filter(p=>p.freelance_id===f.id).length} prospects · ${n} appels</span></div>
  <button class="btn l" onclick="api('admin_actif',{id:'${f.id}',actif:${!f.actif}}).then(charger)">${f.actif?'Désactiver':'Réactiver'}</button></div>
  <p class="hint">Son lien personnel (à lui envoyer, ne pas diffuser) :</p><input style="width:100%" readonly value="${lien}" onclick="this.select();navigator.clipboard&&navigator.clipboard.writeText(this.value)"></div>`}).join('');
 if(T==='prospects')h+=`<div class="card"><b>Importer des prospects</b><p class="hint">Une ligne par prospect, séparée par des points-virgules : <b>Nom ; Entreprise ; Téléphone ; Ville ; Métier</b>. Le freelance ne verra jamais le numéro complet. Les ~64 000 artisans de la base (RGE, paysagistes…) restent cachés : chaque freelance choisit une région et/ou une activité et reçoit au maximum 100 prospects en cours, qui ne sont qu'à lui. Il en reçoit d'autres quand il en termine ou archive.</p>
  <select id="pf">${D.freelances.map(f=>`<option value="${f.id}">${esc(f.prenom+' '+(f.nom||''))}</option>`).join('')}</select><textarea id="pl" rows="6" style="margin-top:8px" placeholder="Dupont ; Dupont Plomberie ; 06 12 34 56 78 ; Vannes ; Plombier"></textarea><button class="btn" style="margin-top:8px" onclick="importer()">Importer</button><div id="pr" class="hint"></div></div>`+
  `<div class="card">${D.prospects.slice(-300).reverse().map(p=>`<div class="row" style="border-bottom:1px solid #EEF2F6;padding:6px 0"><span>${esc([p.nom,p.entreprise,p.ville].filter(Boolean).join(' · '))}</span><span class="hint">${esc(nomF(p.freelance_id))} · ${esc(p.statut)}</span></div>`).join('')||'<span class="hint">Aucun prospect.</span>'}</div>`;
 $('app').innerHTML=h}
async function ajoutF(){const r=await api('admin_freelance',{prenom:$('fp').value,nom:$('fn').value,telephone:$('ft').value});if(r.erreur)return alert(r.erreur);charger()}
async function importer(){const r=await api('admin_import',{freelance_id:$('pf').value,lignes:$('pl').value});$('pr').textContent=r.erreur||(r.ajoutes+' prospect(s) ajouté(s)'+(r.rejets.length?' · '+r.rejets.length+' ligne(s) sans téléphone valide ignorée(s)':''));if(!r.erreur){D=null;charger()}}
charger();
</script></body></html>
