<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .navy { fill: #14304A; }
      .orange { fill: #E8622C; }
      .paper { fill: #F4F7F9; }
    </style>
  </defs>

  <rect x="0" y="0" width="140" height="140" rx="28" class="navy"/>

  <!-- Feuille de devis, légèrement inclinée -->
  <g transform="rotate(-6 62 70)">
    <rect x="30" y="24" width="64" height="86" rx="6" class="paper"/>
    <!-- Lignes de texte du devis -->
    <rect x="40" y="38" width="34" height="5" rx="2" class="navy" opacity="0.55"/>
    <rect x="40" y="50" width="44" height="5" rx="2" class="navy" opacity="0.35"/>
    <rect x="40" y="62" width="28" height="5" rx="2" class="navy" opacity="0.35"/>
    <!-- Ligne total -->
    <rect x="40" y="90" width="44" height="2" class="navy" opacity="0.25"/>
  </g>

  <!-- Badge € : le devis chiffré, élément central -->
  <circle cx="96" cy="92" r="30" class="orange"/>
  <text x="96" y="104" text-anchor="middle" font-family="'Big Shoulders Display', Arial, sans-serif"
        font-weight="900" font-size="34" class="paper">€</text>

  <!-- Flèche de croissance (publicité / Ads qui génère la demande) -->
  <path d="M 22 46 L 40 30 L 40 38 L 56 38 L 56 46 L 40 46 L 40 54 Z" class="orange"/>
</svg>
